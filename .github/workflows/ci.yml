name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static app files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/manifest-192.png
          test -f icons/manifest-512.png
          file icons/manifest-192.png | grep 'PNG image data'
          file icons/manifest-512.png | grep 'PNG image data'
