/* ---------------------------------------------------------------------------
   7) ACCOUNT HANDLERS
   --------------------------------------------------------------------------- */
function normalizeUser(user) {
  user.logs = Object.assign(blankLogs(), user.logs || {});
  ['workouts', 'food', 'weights', 'measurements', 'sleep', 'symptoms'].forEach(key => {
    if (!Array.isArray(user.logs[key])) user.logs[key] = [];
  });
  if (!user.logs.hydration || typeof user.logs.hydration !== 'object') user.logs.hydration = {};
  user.profile = user.profile || {};
  user.profile.diet = normalizeDiet(user.profile.diet);
  user.settings = user.settings || { theme: '' };
  user.settings.trainerMode = user.settings.trainerMode === 'home' ? 'home' : 'gym';
  user.key = user.key || String(user.username || '').toLowerCase();
  return user;
}

async function handleLogin(formData) {
  const username = String(formData.get('username') || '').trim().toLowerCase();
  const password = String(formData.get('password') || '');
  const user = state.db.profiles[username];
  if (!user) {
    state.authError = 'No profile found with that username on this browser.';
    renderAuth();
    return;
  }
  const hash = await hashPassword(password, user.salt);
  if (hash !== user.hash) {
    state.authError = 'That password does not match. Try again.';
    renderAuth();
    return;
  }
  state.user = normalizeUser(user);
  state.authError = '';
  try { localStorage.setItem(SESSION_KEY, user.key || username); } catch (err) { /* ignore */ }
  applyTheme();
  if (!state.user.onboarded) renderOnboarding();
  else renderApp();
  toast(`Welcome back, ${state.user.username}!`);
}

async function handleSignup(formData) {
  const username = String(formData.get('username') || '').trim();
  const key = username.toLowerCase();
  const password = String(formData.get('password') || '');
  const confirm = String(formData.get('confirm') || '');

  if (username.length < 3 || username.length > 24 || !/^[a-zA-Z0-9._-]+$/.test(username)) {
    state.authError = 'Use 3–24 letters, numbers, dots, dashes or underscores.';
    renderAuth();
    return;
  }
  if (password.length < 6) {
    state.authError = 'Use at least 6 characters for your password.';
    renderAuth();
    return;
  }
  if (password !== confirm) {
    state.authError = 'The two passwords do not match.';
    renderAuth();
    return;
  }
  if (state.db.profiles[key]) {
    state.authError = 'That username already exists on this browser. Try logging in.';
    renderAuth();
    return;
  }

  const salt = randomSalt();
  const hash = await hashPassword(password, salt);
  const user = normalizeUser(createUser(username, salt, hash));
  state.db.profiles[key] = user;
  saveDB();
  state.user = user;
  state.authError = '';
  try { localStorage.setItem(SESSION_KEY, key); } catch (err) { /* ignore */ }
  renderOnboarding();
  toast('Profile created. Let’s set up your coaching.');
}

function handleOnboarding(form, formData) {
  const wasEditing = state.editingProfile;
  const equipment = $$('input[name="equipment"]:checked', form).map(input => input.value);
  if (!equipment.length) equipment.push('bodyweight');
  const age = Number(formData.get('age')) || 30;
  const height = Number(formData.get('height')) || 175;
  const weight = Number(formData.get('weight')) || 80;
  const targetWeightRaw = String(formData.get('targetWeight') || '').trim();
  const profile = {
    name: String(formData.get('name') || '').trim() || state.user.username,
    age: clamp(age, 14, 90),
    sex: String(formData.get('sex') || 'other'),
    height: clamp(height, 120, 230),
    weight: clamp(weight, 30, 300),
    targetWeight: targetWeightRaw ? clamp(Number(targetWeightRaw), 30, 300) : null,
    activity: String(formData.get('activity') || 'moderate'),
    goal: String(formData.get('goal') || 'maintain'),
    diet: normalizeDiet(formData.get('diet') || 'nonveg'),
    allergies: String(formData.get('allergies') || '').trim(),
    injuries: String(formData.get('injuries') || '').trim(),
    equipment,
    daysPerWeek: clamp(Number(formData.get('daysPerWeek')) || 3, 1, 7),
    experience: String(formData.get('experience') || 'beginner'),
    // A brand-new profile starts its progress bar at the weight entered.
    // Editing keeps the original starting weight so progress stays meaningful.
    startWeight: wasEditing ? (state.user.profile.startWeight || weight) : weight
  };

  state.user.profile = profile;
  state.user.onboarded = true;
  state.editingProfile = false;

  // Keep a real weight entry so progress charts start immediately.
  const latestWeight = sortedWeights(state.user).slice(-1)[0];
  if (!state.user.logs.weights.length) {
    state.user.logs.weights.push({ date: today(), kg: profile.weight });
  } else if (wasEditing && (!latestWeight || latestWeight.kg !== profile.weight)) {
    // A changed profile weight updates today's weigh-in, so targets update too.
    state.user.logs.weights = state.user.logs.weights.filter(entry => entry.date !== today());
    state.user.logs.weights.push({ date: today(), kg: profile.weight });
  }

  saveUser();
  state.tab = 'dashboard';
  renderApp();
  toast('Your plan is ready. Let’s get to work!');
}

/* ---------------------------------------------------------------------------
   8) DATA ACTIONS
   --------------------------------------------------------------------------- */
function exportData() {
  if (!state.user) return;
  const payload = {
    app: 'Trainer4U',
    version: 1,
    exportedAt: new Date().toISOString(),
    username: state.user.username,
    profile: state.user.profile,
    logs: state.user.logs,
    settings: state.user.settings
  };
  download(`trainer4u-${state.user.username}-${today()}.json`, JSON.stringify(payload, null, 2));
  toast('Progress exported as JSON.');
}

async function importData(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object' || !data.profile || !data.logs) {
      throw new Error('That file does not look like a Trainer4U export.');
    }
    if (!confirm('Replace your current logs with the imported data? Your account and username stay the same.')) return;
    state.user.profile = { ...state.user.profile, ...data.profile };
    state.user.logs = Object.assign(blankLogs(), data.logs);
    state.user.onboarded = true;
    normalizeUser(state.user);
    saveUser();
    closeModal();
    renderApp();
    toast('Progress imported successfully.');
  } catch (err) {
    toast(`Import failed: ${err.message}`);
  }
}

function resetProgress() {
  if (!confirm('Clear all workout, food, weight, sleep and wellness logs for this profile? Your account and profile stay.')) return;
  const current = currentWeight(state.user);
  state.user.logs = blankLogs();
  state.user.logs.weights.push({ date: today(), kg: current });
  state.user.profile.startWeight = current;
  saveUser();
  closeModal();
  renderApp();
  toast('Progress reset. Fresh start.');
}

function deleteEverything() {
  if (!confirm('Delete ALL profiles and fitness data stored in this browser? This cannot be undone.')) return;
  if (!confirm('Really delete everything? Consider exporting a backup first.')) return;
  try {
    localStorage.removeItem(DB_KEY);
    localStorage.removeItem(SESSION_KEY);
  } catch (err) { /* ignore */ }
  state.db = { profiles: {} };
  state.user = null;
  location.reload();
}

function logout() {
  closeModal();
  try { localStorage.removeItem(SESSION_KEY); } catch (err) { /* ignore */ }
  state.user = null;
  state.tab = 'dashboard';
  state.authMode = 'login';
  state.authError = '';
  renderAuth();
  toast('Logged out.');
}

/* ---------------------------------------------------------------------------
   9) EVENT DELEGATION
   --------------------------------------------------------------------------- */
document.addEventListener('click', event => {
  playClickSound();
  const trigger = event.target.closest('[data-action]');
  if (!trigger) return;
  const action = trigger.dataset.action;
  const u = state.user;

  switch (action) {
    case 'tab':
      state.tab = trigger.dataset.tab;
      state.editingProfile = false;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    case 'toggle-theme':
      toggleTheme();
      break;

    case 'auth-mode':
      state.authMode = trigger.dataset.mode;
      state.authError = '';
      renderAuth();
      break;

    case 'fill-demo': {
      const form = document.querySelector('form[data-form="login"]');
      if (form) {
        const username = form.querySelector('input[name="username"]');
        const password = form.querySelector('input[name="password"]');
        if (username) username.value = 'demo';
        if (password) password.value = 'demo1234';
        toast('Demo credentials filled — press Log in.');
      }
      break;
    }

    case 'open-settings':
      openModal({ type: 'settings' });
      break;

    case 'close-modal':
      // Ignore clicks inside the sheet itself.
      if (trigger.classList.contains('modal-overlay') && event.target !== trigger) break;
      closeModal();
      break;

    case 'edit-profile':
      state.editingProfile = true;
      closeModal();
      renderApp();
      break;

    case 'cancel-edit':
      state.editingProfile = false;
      renderApp();
      break;

    case 'logout':
      logout();
      break;

    case 'log-workout':
      openModal({ type: 'workout', dayIndex: Number(trigger.dataset.day) });
      break;

    case 'delete-workout':
      if (!u) break;
      u.logs.workouts = u.logs.workouts.filter(workout => workout.id !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Workout deleted.');
      break;

    case 'delete-food':
      if (!u) break;
      u.logs.food = u.logs.food.filter(entry => entry.id !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Food entry removed.');
      break;

    case 'delete-weight':
      if (!u) break;
      u.logs.weights = u.logs.weights.filter(entry => entry.date !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Weigh-in removed.');
      break;

    case 'delete-sleep':
      if (!u) break;
      u.logs.sleep = u.logs.sleep.filter(entry => entry.id !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Sleep entry removed.');
      break;

    case 'delete-symptom':
      if (!u) break;
      u.logs.symptoms = u.logs.symptoms.filter(entry => entry.id !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Note removed.');
      break;

    case 'hydrate': {
      if (!u) break;
      const delta = Number(trigger.dataset.delta) || 0;
      const date = today();
      const next = Math.max(0, (Number(u.logs.hydration[date]) || 0) + delta);
      u.logs.hydration[date] = next;
      saveUser();
      renderApp();
      toast(`${next} cup${next === 1 ? '' : 's'} logged today.`);
      break;
    }

    case 'trainer-mode': {
      state.trainerMode = trigger.dataset.mode === 'home' ? 'home' : 'gym';
      if (u) {
        u.settings = u.settings || {};
        u.settings.trainerMode = state.trainerMode;
        saveUser();
      }
      renderApp();
      break;
    }

    case 'recipe-open':
      openModal({ type: 'recipe', index: Number(trigger.dataset.index), step: 0 });
      break;

    case 'clear-chef-filters':
      state.chefFilters = { cuisine: 'All', diet: 'All', meal: 'All' };
      renderApp();
      break;

    case 'recipe-nav': {
      if (!state.modal || state.modal.type !== 'recipe') break;
      const recipe = RECIPES[state.modal.index];
      state.modal.step = clamp((state.modal.step || 0) + Number(trigger.dataset.dir), 0, recipe.steps.length - 1);
      renderModal();
      const modal = $('.modal');
      if (modal) modal.scrollTop = 0;
      break;
    }

    case 'clear-ingredients':
      state.chefIngredients = '';
      renderApp();
      break;

    case 'export-data':
      exportData();
      break;

    case 'reset-progress':
      resetProgress();
      break;

    case 'delete-all':
      deleteEverything();
      break;

    case 'goto-tab':
      state.tab = trigger.dataset.tab;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    default:
      break;
  }
});

document.addEventListener('submit', async event => {
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();
  const type = form.dataset.form;
  const formData = new FormData(form);
  const u = state.user;

  try {
    if (type === 'login') {
      await handleLogin(formData);
      return;
    }
    if (type === 'signup') {
      await handleSignup(formData);
      return;
    }
    if (type === 'onboarding') {
      handleOnboarding(form, formData);
      return;
    }
    if (!u) return;

    if (type === 'add-food') {
      const date = String(formData.get('date') || today());
      const name = String(formData.get('food') || '');
      const grams = Number(formData.get('grams'));
      const meal = String(formData.get('meal') || 'Snack');
      if (date > today()) { toast('You cannot log food in the future.'); return; }
      if (!grams || grams <= 0) { toast('Enter a portion in grams.'); return; }
      const food = FOOD_DB.find(item => item.name === name);
      if (!food) { toast('Pick a food from the list.'); return; }
      u.logs.food.push(sampleFoodEntry(date, meal, name, Math.min(grams, 2000)));
      saveUser();
      renderApp();
      toast(`${name} added to ${meal.toLowerCase()}.`);
      return;
    }

    if (type === 'add-weight') {
      const date = String(formData.get('date') || today());
      const kg = Number(formData.get('kg'));
      if (date > today()) { toast('You cannot log a future weigh-in.'); return; }
      if (!kg || kg < 30 || kg > 300) { toast('Enter a weight between 30 and 300 kg.'); return; }
      u.logs.weights = u.logs.weights.filter(entry => entry.date !== date);
      u.logs.weights.push({ date, kg: round(kg, 1) });
      if (!u.profile.startWeight) u.profile.startWeight = kg;
      u.profile.weight = round(kg, 1);
      saveUser();
      renderApp();
      toast('Weight saved.');
      return;
    }

    if (type === 'add-measure') {
      const date = String(formData.get('date') || today());
      if (date > today()) { toast('You cannot log future measurements.'); return; }
      const entry = {
        id: uid(),
        date,
        chest: Number(formData.get('chest')) || null,
        waist: Number(formData.get('waist')) || null,
        hips: Number(formData.get('hips')) || null,
        arm: Number(formData.get('arm')) || null,
        thigh: Number(formData.get('thigh')) || null
      };
      if (!entry.chest && !entry.waist && !entry.hips && !entry.arm && !entry.thigh) {
        toast('Add at least one measurement.');
        return;
      }
      u.logs.measurements = u.logs.measurements.filter(item => item.date !== date);
      u.logs.measurements.push(entry);
      saveUser();
      renderApp();
      toast('Measurements saved.');
      return;
    }

    if (type === 'add-sleep') {
      const date = String(formData.get('date') || today());
      const hours = Number(formData.get('hours'));
      if (date > today()) { toast('You cannot log future sleep.'); return; }
      if (!hours || hours <= 0 || hours > 16) { toast('Enter sleep hours between 0 and 16.'); return; }
      u.logs.sleep.push({
        id: uid(), date, hours: round(hours, 2),
        quality: clamp(Number(formData.get('quality')) || 3, 1, 5)
      });
      saveUser();
      renderApp();
      toast('Sleep logged.');
      return;
    }

    if (type === 'add-symptom') {
      const date = String(formData.get('date') || today());
      const note = String(formData.get('note') || '').trim();
      if (!note) { toast('Describe what you are noticing.'); return; }
      if (date > today()) { toast('You cannot log future notes.'); return; }
      u.logs.symptoms.push({
        id: uid(), date, note,
        severity: String(formData.get('severity') || 'low')
      });
      saveUser();
      renderApp();
      toast('Note saved. Take care of yourself.');
      return;
    }

    if (type === 'chef-ingredients') {
      state.chefIngredients = String(formData.get('ingredients') || '').trim();
      renderApp();
      if (!state.chefIngredients) toast('Add a few ingredients to search.');
      return;
    }

    if (type === 'log-workout') {
      const dayIndex = Number(form.dataset.day);
      const plan = buildPlan(u);
      const day = plan.schedule[dayIndex];
      if (!day || day.rest) { toast('That day is a rest day.'); closeModal(); return; }
      const exercises = day.exercises.map((exercise, index) => {
        const defaultReps = parseInt(String(exercise.reps).split(/[–-]/).pop(), 10) || 12;
        return {
          name: exercise.name,
          sets: exercise.sets,
          reps: Number(formData.get(`r${index}`)) || defaultReps,
          weight: Number(formData.get(`w${index}`)) || 0
        };
      });
      u.logs.workouts.push({
        id: uid(),
        date: String(formData.get('date') || today()),
        label: day.label,
        focus: day.focus,
        duration: clamp(Number(formData.get('duration')) || 45, 5, 240),
        notes: String(formData.get('notes') || '').trim(),
        exercises
      });
      saveUser();
      closeModal();
      renderApp();
      toast('Workout logged. Strong work!');
      return;
    }
  } catch (err) {
    console.error(err);
    toast('Something went wrong. Please try again.');
  }
});

document.addEventListener('change', async event => {
  const input = event.target;
  if (input.id === 'import-file' && input.files && input.files[0]) {
    await importData(input.files[0]);
    input.value = '';
    return;
  }
  if (input.matches('[data-change="measure"]')) {
    state.measure = input.value;
    renderApp();
    return;
  }
  if (input.matches('[data-change="chef-cuisine"], [data-change="chef-diet"], [data-change="chef-meal"]')) {
    const key = input.dataset.change.replace('chef-', '');
    if (key === 'cuisine' || key === 'diet' || key === 'meal') {
      state.chefFilters[key] = input.value;
      renderApp();
    }
  }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && state.modal) closeModal();
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.tab === 'progress') drawCharts();
  }, 150);
});

/* ---------------------------------------------------------------------------
   10) BOOT
   --------------------------------------------------------------------------- */
async function init() {
  state.db = loadDB();
  applyTheme();
  await seedDemoProfile();

  let session = null;
  try { session = localStorage.getItem(SESSION_KEY); } catch (err) { /* ignore */ }

  if (session && state.db.profiles[session]) {
    state.user = normalizeUser(state.db.profiles[session]);
    applyTheme();
    if (!state.user.onboarded) renderOnboarding();
    else renderApp();
  } else {
    renderAuth();
  }
}

// The markup lives inside this same file, so the DOM is ready when this runs.
init();
</script>
</body>
</html>
