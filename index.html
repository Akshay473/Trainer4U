<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Trainer4U — a private, local-only fitness coaching app for workouts, nutrition, recipes, wellness and progress.">
<meta name="color-scheme" content="light dark">
<title>Trainer4U — Your pocket fitness coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230F172A'/%3E%3Cg transform='rotate(-45 256 256)'%3E%3Cpath d='M116 256a140 140 0 0 1 280 0' fill='none' stroke='%23881337' stroke-width='24'/%3E%3Cpath d='M396 256a140 140 0 0 1-280 0' fill='none' stroke='%23E8F5E9' stroke-width='24'/%3E%3C/g%3E%3Crect x='216' y='216' width='80' height='80' rx='24' fill='%23E8F5E9' transform='rotate(45 256 256)'/%3E%3Crect x='241' y='241' width='30' height='30' rx='8' fill='%23881337' transform='rotate(45 256 256)'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Trainer4U — all styling is in this single file.
   Mobile-first, CSS-variable based light/dark theme.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
:root {
  color-scheme: dark;
  --bg: #0F172A;
  --bg-2: #111827;
  --panel: #0F172A;
  --panel-2: #1A2332;
  --text: #E8F5E9;
  --muted: #A8B3C7;
  --line: rgba(255, 255, 255, .12);
  --accent: #881337;
  --accent-soft: rgba(136, 19, 55, .24);
  --accent-ink: rgba(255, 255, 255, .9);
  --good: #E8F5E9;
  --warn: #881337;
  --bad: #F3C9D5;
  --chart-contrast: #0F172A;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .40);
  --shadow: 0 1px 2px rgba(0, 0, 0, .40), 0 18px 38px -18px rgba(0, 0, 0, .80);
  --radius: 20px;
  --radius-sm: 12px;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #F8FAFC;
  --bg-2: #F1F5F9;
  --panel: #E8F5E9;
  --panel-2: #F1F8F8;
  --text: #0F172A;
  --muted: #6B7280;
  --line: #E5E7EB;
  --accent: #881337;
  --accent-soft: #FDE8F0;
  --accent-ink: #881337;
  --good: #E8F5E9;
  --warn: #881337;
  --bad: #F3C9D5;
  --chart-contrast: #0F172A;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 14px 30px -18px rgba(0, 0, 0, .15);
  --radius: 20px;
  --radius-sm: 12px;
}
/* Cards are light green in both themes; the shell stays navy in the default theme. */
.card, .stat, .modal, .auth-card, .onboard {
  --panel: #E8F5E9;
  --panel-2: #F1F8F8;
  --text: #0F172A;
  --muted: #57617A;
  --line: #E3E7EE;
  --good: #E8F5E9;
  --warn: #881337;
  --bad: #F3C9D5;
  --accent-ink: #881337;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .06);
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 16px 34px -20px rgba(0, 0, 0, .38);
  color: var(--text);
}
body {
  margin: 0;
  min-height: 100vh;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
  background:
    radial-gradient(900px 520px at 8% -10%, rgba(136, 19, 55, .32), transparent 60%),
    radial-gradient(760px 420px at 100% 0%, rgba(136, 19, 55, .18), transparent 55%),
    var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
html[data-theme="light"] body {
  background:
    radial-gradient(900px 520px at 8% -10%, rgba(136, 19, 55, .08), transparent 60%),
    radial-gradient(760px 420px at 100% 0%, rgba(15, 23, 42, .06), transparent 55%),
    var(--bg);
}
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: clamp(1.45rem, 4vw, 2rem); letter-spacing: -.03em; line-height: 1.15; }
h2 { font-size: 1.08rem; letter-spacing: -.015em; }
h3 { font-size: .98rem; letter-spacing: -.01em; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.tiny { font-size: .72rem; }
.w-full { width: 100%; }
.hidden { display: none !important; }

/* ---------- Header + tabs ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; max-width: 1140px; margin: 0 auto; padding: 14px 16px 8px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 850; font-size: 1.12rem; letter-spacing: -.025em; color: var(--text); }
.logo {
  width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;
  background: #0F172A; overflow: hidden; flex: 0 0 auto;
  box-shadow: 0 10px 22px -12px rgba(0, 0, 0, .9);
  border: 1px solid rgba(255, 255, 255, .12);
}
.logo svg { width: 100%; height: 100%; display: block; }
.brand-accent { color: var(--accent-ink); }
.header-actions { display: flex; align-items: center; gap: 7px; min-width: 0; }
.userchip {
  max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: .78rem; font-weight: 700; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 72%, transparent);
  border: 1px solid var(--line); padding: 7px 10px; border-radius: 999px;
}
.icon-btn {
  width: 38px; height: 38px; flex: 0 0 auto; border-radius: 12px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 82%, transparent);
  display: grid; place-items: center; font-size: .74rem; font-weight: 750;
  transition: .18s transform, .18s background, .18s border-color; box-shadow: var(--shadow-sm);
}
.icon-btn svg { width: 17px; height: 17px; display: block; }
.icon-btn:hover { transform: translateY(-1px); background: var(--panel-2); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs {
  position: sticky; top: 0; z-index: 30; display: flex; gap: 5px; overflow-x: auto;
  padding: 9px max(12px, calc((100vw - 1140px) / 2 + 16px));
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line); scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 42px; padding: 9px 13px; border-radius: 999px; border: 1px solid transparent;
  background: transparent; color: var(--muted); font-weight: 650; font-size: .84rem; white-space: nowrap;
  transition: transform .24s ease, background .18s ease, color .18s ease, border-color .18s ease;
}
.tab:hover, .tab:focus-visible { color: var(--text); background: var(--panel-2); transform: scale(1.08); }
.tab .tab-ico {
  display: inline-block; max-width: 2.2em; overflow: hidden; opacity: 1; line-height: 1.15;
  transition: max-width .24s ease, opacity .16s ease;
}
.tab .tab-label {
  display: inline-block; max-width: 0; overflow: hidden; opacity: 0;
  font-size: .84rem; letter-spacing: -.01em;
  transition: max-width .24s ease, opacity .18s ease;
}
.tab:hover .tab-ico, .tab:focus-visible .tab-ico { max-width: 0; opacity: 0; }
.tab:hover .tab-label, .tab:focus-visible .tab-label { max-width: 140px; opacity: 1; }
.tab.active {
  background: var(--accent); color: #fff; border-color: transparent;
  box-shadow: 0 10px 24px -14px rgba(136, 19, 55, .95);
}
.tab.active:hover, .tab.active:focus-visible { background: var(--accent); color: #fff; }
.tab .dot {
  position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 999px; background: var(--accent); color: #fff; font-size: .62rem; font-weight: 800;
  display: grid; place-items: center; border: 2px solid var(--bg);
}
.tab.active .dot { background: #fff; color: var(--accent); border-color: var(--accent); }
.main { width: 100%; max-width: 1140px; margin: 0 auto; padding: 20px 16px 42px; }
.main > * + * { margin-top: 16px; }
.foot { max-width: 1140px; margin: 0 auto; padding: 4px 16px 34px; color: var(--muted); font-size: .72rem; text-align: center; }

/* ---------- Cards, grid & headings ---------- */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow); min-width: 0;
}
.card.tight { padding: 14px; border-radius: var(--radius-sm); }
.card.flat { box-shadow: none; }
.grid { display: grid; gap: 14px; min-width: 0; }
.grid > * { min-width: 0; }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 14px; min-width: 0; }
.grid-2 > *, .grid-3 > *, .grid-4 > * { min-width: 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head .sub { color: var(--muted); font-size: .86rem; margin-top: 3px; max-width: 60ch; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h2 { display: flex; align-items: center; gap: 7px; }
.card-ico { font-size: 1.05rem; }
.divider { height: 1px; background: var(--line); margin: 14px 0; border: 0; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; font-size: .88rem; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 15px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); font-weight: 650; font-size: .87rem;
  transition: .16s transform, .16s box-shadow, .16s background; text-decoration: none;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 10px 24px -14px rgba(136, 19, 55, .95); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 90%, var(--bg)); box-shadow: 0 14px 26px -14px rgba(136, 19, 55, .95); }
.btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: transparent; }
.btn-sm { padding: 7px 11px; font-size: .78rem; border-radius: 10px; }
.btn-xs { padding: 5px 8px; font-size: .72rem; border-radius: 8px; }
.btn-icon { padding: 6px 8px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Pills, badges, alerts ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  font-size: .73rem; font-weight: 700; white-space: nowrap;
}
.pill.accent { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.pill.good { background: color-mix(in srgb, var(--good) 90%, var(--panel)); color: var(--good); border-color: transparent; }
.pill.warn { background: color-mix(in srgb, var(--warn) 90%, var(--panel)); color: var(--warn); border-color: transparent; }
.pill.bad { background: color-mix(in srgb, var(--bad) 90%, var(--panel)); color: var(--bad); border-color: transparent; }
.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; font-size: .68rem; font-weight: 750; background: var(--panel-2); color: var(--muted); }
.badge.good { background: color-mix(in srgb, var(--good) 90%, var(--panel)); color: var(--good); }
.badge.warn { background: color-mix(in srgb, var(--warn) 90%, var(--panel)); color: var(--warn); }
.badge.bad { background: color-mix(in srgb, var(--bad) 90%, var(--panel)); color: var(--bad); }
.alert {
  border: 1px solid var(--line); border-left: 4px solid var(--accent);
  background: var(--panel); border-radius: var(--radius-sm); padding: 13px 14px;
}
.alert + .alert { margin-top: 9px; }
.alert.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 70%, var(--panel)); }
.alert.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 70%, var(--panel)); }
.alert.good { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 70%, var(--panel)); }
.alert.info { border-left-color: var(--accent); }
.alert-title { display: flex; align-items: center; gap: 7px; font-weight: 750; font-size: .9rem; }
.alert p { color: var(--muted); font-size: .82rem; margin-top: 4px; }
.alert-fix { margin-top: 8px; font-size: .8rem; font-weight: 600; color: var(--text); background: var(--panel-2); border-radius: 9px; padding: 7px 9px; }
.alert-fix b { color: var(--accent-ink); }
.alert-stack .alert { margin-top: 0; }
.warning-banner { border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--line)); background: color-mix(in srgb, var(--bad) 15%, var(--panel)); color: var(--text); border-radius: var(--radius-sm); padding: 12px 14px; font-size: .84rem; }
.warning-banner strong { color: var(--bad); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field-label { font-size: .76rem; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="number"], input[type="password"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; padding: 10px 11px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); outline: none; transition: .15s border, .15s box-shadow;
  font-size: .88rem; min-height: 42px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 18px, calc(100% - 11px) 18px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.form-grid { display: grid; gap: 12px; }
.form-error { color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, var(--panel-2)); border-radius: 9px; padding: 8px 10px; font-size: .8rem; font-weight: 600; }
.form-note { color: var(--muted); font-size: .74rem; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 7px; }
.check {
  display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel-2); font-size: .8rem; cursor: pointer; user-select: none;
}
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.segmented { display: flex; gap: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.segmented button { flex: 1; padding: 8px 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; font-size: .82rem; }
.segmented button.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow-sm); }
.trainer-switch { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.trainer-switch .segmented { width: 100%; max-width: 460px; }
.trainer-switch .segmented button { white-space: nowrap; }
.filter-bar { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 12px; }
.filter-bar .field > label { font-size: .7rem; }
.filter-summary { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.recipe-meta { font-size: .72rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 3px; }
.recipe-meta span { display: inline-flex; align-items: center; gap: 4px; }
.recipe-serving { font-size: .68rem; color: var(--muted); }
.mode-note { font-size: .78rem; color: var(--muted); margin-top: 8px; max-width: 68ch; }

/* ---------- Dashboard ---------- */
.hero { position: relative; overflow: hidden; }
.hero::after {
  content: ""; position: absolute; right: -70px; top: -90px; width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 20%, transparent), transparent 65%);
  pointer-events: none;
}
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.hero-greeting { font-size: .78rem; font-weight: 750; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .09em; }
.hero h1 { margin-top: 5px; }
.hero-sub { color: var(--muted); font-size: .86rem; margin-top: 6px; max-width: 52ch; }
.hero-progress { margin-top: 24px; }
.progress-label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: .77rem; font-weight: 650; color: var(--muted); margin-bottom: 6px; }
.progress-label strong { color: var(--text); font-size: .9rem; }
.progress { height: 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent)); transition: width .5s ease; }
.progress.good > span { background: linear-gradient(90deg, var(--accent), var(--accent)); }
.progress.warn > span { background: linear-gradient(90deg, var(--accent), var(--accent)); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow-sm); min-width: 0; }
.stat-value { font-size: 1.22rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.stat-value small { font-size: .65em; font-weight: 650; color: var(--muted); margin-left: 2px; }
.stat-label { font-size: .69rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
.stat-sub { font-size: .7rem; color: var(--muted); margin-top: 4px; }
.today-plan-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.today-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: .85rem; }
.today-row:last-child { border-bottom: 0; }
.today-row .muted { font-size: .74rem; }
/* ---------- Onboarding & auth ---------- */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 22px 16px 40px; }
.auth-shell { width: 100%; max-width: 1060px; display: grid; gap: 22px; align-items: center; }
.auth-hero { padding: 8px 4px; }
.auth-hero h1 { margin-top: 20px; font-size: clamp(2rem, 5.2vw, 3.25rem); line-height: 1.04; letter-spacing: -.045em; }
.auth-hero h1 span { color: var(--accent-ink); }
.auth-hero p { color: var(--muted); font-size: .9rem; max-width: 52ch; margin-top: 12px; }
.auth-features { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
.auth-list { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 9px; }
.auth-list li { display: flex; gap: 9px; font-size: .82rem; color: var(--muted); align-items: flex-start; }
.auth-list li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; margin-top: 7px; }
.auth-card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: var(--shadow); }
.auth-card h2 { margin-bottom: 4px; }
.auth-switch { margin: 15px 0 16px; }
.auth-demo { margin-top: 14px; padding: 11px 12px; border-radius: 12px; background: var(--panel-2); border: 1px dashed var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.auth-demo p { font-size: .74rem; color: var(--muted); }
.auth-demo b { color: var(--text); }
.onboard-wrap { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 42px; }
.onboard { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: var(--shadow); }
.onboard-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.form-grid { display: grid; gap: 12px; }
.form-grid .span-2 { min-width: 0; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 7px; }

/* ---------- Trainer ---------- */
.day-card { display: flex; flex-direction: column; gap: 10px; }
.day-card > .btn { margin-top: auto; align-self: flex-start; }
.day-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.day-weekday { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); }
.day-name { font-size: 1.02rem; font-weight: 800; letter-spacing: -.02em; }
.recovery-tip { color: var(--muted); font-size: .8rem; }
.exercise-list { display: grid; gap: 8px; }

  if (!toneContext) return;
  const now = toneContext.currentTime;
  const osc = toneContext.createOscillator();
  const gain = toneContext.createGain();
  // Pleasant "ding" sound: triangle wave, starts high, slides down quickly
  osc.type = 'triangle';
  osc.frequency.value = 1200;
  osc.connect(gain);
  gain.connect(toneContext.destination);
  // Quick exponential fade-out in 80ms
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  osc.start(now);
  osc.stop(now + 0.1);
}

const ALLERGEN_WORDS = {
  dairy: ['dairy', 'milk', 'lactose', 'yogurt', 'yoghurt', 'cheese', 'butter', 'cream', 'paneer', 'ricotta', 'mozzarella', 'halloumi'],
  eggs: ['egg', 'omelette', 'frittata'],

  soy: ['soy', 'tofu', 'edamame', 'miso', 'tempeh'],

// Accept the stored diet keys as well as friendly text ("Vegetarian", "Veg",
// "eggitarian" and so on) so profile edits never break recipe filtering.
function normalizeDiet(value) {
  const text = String(value || '').toLowerCase().trim();
  if (DIET_LABELS[text]) return text;
  if (text.includes('vegan')) return 'vegan';
  if (text.includes('egg')) return 'eggetarian';
  if (text.includes('veg')) return 'vegetarian';
  return 'nonveg';
}

// Recipes tag every diet they are compatible with. A non-vegetarian eater can
// eat anything; stricter diets only see recipes tagged for that diet.
function fitsDiet(recipe, diet) {
  const key = normalizeDiet(diet);
  if (key === 'nonveg') return true;
  return (recipe.diets || []).includes(key);
}

// Remove recipes that contain an allergen named by the user. This is a
// best-effort text match, not a medical allergy guarantee.
function allergenFree(recipe, allergies) {
  const text = String(allergies || '').toLowerCase().trim();
  if (!text) return true;

  const ignored = new Set(['none', 'no', 'nil', 'nothing', 'na', 'n/a']);
  const tokens = text
    .split(/[,;/|]+|\band\b/)
    .map(token => token.trim())
    .filter(token => token.length > 2 && !ignored.has(token));
  if (!tokens.length) return true;

  const categories = new Set();
  Object.entries(ALLERGEN_WORDS).forEach(([category, words]) => {
    if (words.some(word => text.includes(word))) categories.add(category);
  });

  const listed = recipe.allergens || [];
  if (listed.some(allergen => categories.has(allergen))) return false;

  const ingredientText = (recipe.ingredients || [])
    .map(item => String(item.name || '').toLowerCase())
    .join(' ');
  return !tokens.some(token => ingredientText.includes(token));
}

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return { profiles: {} };
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return { profiles: {} };
    if (!parsed.profiles || typeof parsed.profiles !== 'object') parsed.profiles = {};
    return parsed;
  } catch (err) {
    return { profiles: {} };
  }
}

function saveDB() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(state.db));
  } catch (err) {
    toast('Could not save to this browser. Storage may be full.');
  }
}

function saveUser() {
  if (!state.user) return;
  state.user.key = state.user.key || String(state.user.username || '').toLowerCase();
  state.db.profiles[state.user.key] = state.user;
  saveDB();
}

function randomSalt() {
  try {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
  } catch (err) {
    return `fallback-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }
}

function fallbackHash(text) {
  let h1 = 0xdeadbeef ^ text.length;
  let h2 = 0x41c6ce57 ^ text.length;
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ code, 2654435761);
    h2 = Math.imul(h2 ^ code, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return `${(h1 >>> 0).toString(16).padStart(8, '0')}${(h2 >>> 0).toString(16).padStart(8, '0')}`;
}

async function hashPassword(password, salt) {
  const text = `${salt}:${password}`;
  try {
    if (window.crypto && window.crypto.subtle) {
      const bytes = new TextEncoder().encode(text);
      const digest = await window.crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
    }
  } catch (err) { /* fall through */ }
  return fallbackHash(text);
}

function sampleFoodEntry(date, meal, name, grams) {
  const food = FOOD_DB.find(item => item.name === name) || { cal: 0, protein: 0, carbs: 0, fat: 0 };
  const factor = Number(grams) / 100;
  return {
    id: uid(),
    date,
    meal,
    name,
    grams: Number(grams),
    calories: round(food.cal * factor, 0),
    protein: round(food.protein * factor, 1),
    carbs: round(food.carbs * factor, 1),
    fat: round(food.fat * factor, 1)
  };
}

/* ---------------------------------------------------------------------------
   Coaching maths
   --------------------------------------------------------------------------- */
function totalsForEntries(entries) {
  return entries.reduce((sum, entry) => {
    sum.calories += Number(entry.calories) || 0;
    sum.protein += Number(entry.protein) || 0;
    sum.carbs += Number(entry.carbs) || 0;
    sum.fat += Number(entry.fat) || 0;
    return sum;
  }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
}

function getCaloriesForDate(user, date) {
  return totalsForEntries(user.logs.food.filter(entry => entry.date === date));
}

function sortedWeights(user) {
  return [...user.logs.weights]
    .filter(entry => entry && entry.date)
    .sort((a, b) => a.date.localeCompare(b.date));
}

function currentWeight(user) {
  const weights = sortedWeights(user);
  if (weights.length) return Number(weights[weights.length - 1].kg) || 0;
  return Number(user.profile.weight) || 0;
}

function weightProgress(user) {
  const weights = sortedWeights(user);
  const start = Number(user.profile.startWeight) || (weights[0] && Number(weights[0].kg)) || currentWeight(user);
  const current = currentWeight(user) || start;
  const target = Number(user.profile.targetWeight) || null;
  const change = round(current - start, 1);
  const total = target ? Math.abs(target - start) : 0;
  const done = target && total > 0 ? Math.abs(current - start) : 0;
  const pct = target && total > 0 ? clamp((done / total) * 100, 0, 100) : 0;
  return {
    start: round(start, 1),
    current: round(current, 1),
    target,
    change,
    toGo: target ? round(Math.abs(target - current), 1) : null,
    pct: Math.round(pct)
  };
}

function workoutsLast7(user) {
  const from = dateOffset(-6);
  return user.logs.workouts.filter(workout => workout.date >= from && workout.date <= today());
}

function loggingStreak(user) {
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const date = dateOffset(-i);
    const hasLog = user.logs.food.some(entry => entry.date === date) ||
      user.logs.weights.some(entry => entry.date === date) ||
      user.logs.workouts.some(entry => entry.date === date) ||
      user.logs.sleep.some(entry => entry.date === date);
    if (hasLog) streak += 1;
    else if (i === 0) continue;
    else break;
  }
  return streak;
}

function sleepAverage(user) {
  const from = dateOffset(-13);
  const entries = user.logs.sleep.filter(entry => entry.date >= from);
  if (!entries.length) return null;
  return entries.reduce((sum, entry) => sum + Number(entry.hours || 0), 0) / entries.length;
}

function loggedDays(user, days = 7) {
  const result = [];
  for (let i = days - 1; i >= 0; i--) {
    const date = dateOffset(-i);
    const entries = user.logs.food.filter(entry => entry.date === date);
    if (entries.length) {
      result.push({ date, entries: entries.length, ...totalsForEntries(entries) });
    }
  }
  return result;
}

function bmiFor(user) {
  const height = Number(user.profile.height) || 0;
  const weight = currentWeight(user);
  if (!height || !weight) return 0;
  return weight / ((height / 100) ** 2);
}
function bmiCategory(bmi) {
  if (!bmi) return { label: 'Not enough data', cls: '' };
  if (bmi < 18.5) return { label: 'Underweight range', cls: 'warn' };
  if (bmi < 25) return { label: 'Healthy range', cls: 'good' };
  if (bmi < 30) return { label: 'Overweight range', cls: 'warn' };
  return { label: 'Obesity range', cls: 'bad' };
}
function hydrationTarget(user) {
  const weight = currentWeight(user) || Number(user.profile.weight) || 70;
  return Math.round(clamp((weight * 35) / 250, 6, 16));
}
function targetWarnings(user) {
  const warnings = [];
  const p = user.profile;
  const weight = currentWeight(user);
  const target = Number(p.targetWeight) || 0;
  if (target && weight && Math.abs(target - weight) > weight * 0.25) {
    warnings.push('Your target weight is more than 25% away from your current weight. A very large change is best planned with a doctor or registered dietitian.');
  }
  if (target && p.height) {
    const targetBmi = target / ((Number(p.height) / 100) ** 2);
    if (targetBmi < 17.5) warnings.push('Your target weight corresponds to a BMI below 17.5, which is not a safe long-term goal for most people.');
  }
  const t = targets(user);
  if (t.unsafe) warnings.push('Your calculated calorie target was raised to a conservative safety floor. Do not cut further without professional supervision.');
  if (p.age && Number(p.age) < 18) warnings.push('Trainer4U is designed for adults. Teenagers should follow guidance from a paediatrician or qualified coach.');
  return warnings;
}

function baseTargets(user) {
  const p = user.profile || {};
  const weight = currentWeight(user) || Number(p.weight) || 70;
  const height = Number(p.height) || 170;
  const age = Number(p.age) || 30;
  const sexAdjust = p.sex === 'male' ? 5 : p.sex === 'female' ? -161 : -78;
  const bmr = 10 * weight + 6.25 * height - 5 * age + sexAdjust;
  const tdee = bmr * (ACTIVITY_MULTIPLIERS[p.activity] || 1.55);
  const goalDelta = p.goal === 'lose' ? -500 : p.goal === 'gain' ? 400 : p.goal === 'build' ? 250 : 0;
  const safeMin = p.sex === 'female' ? 1200 : p.sex === 'male' ? 1500 : 1350;
  const rawCalories = tdee + goalDelta;
  const unsafe = rawCalories < safeMin;
  const calories = Math.round(clamp(rawCalories, safeMin, 5000) / 10) * 10;
  const proteinPerKg = p.goal === 'lose' || p.goal === 'build' ? 2 : p.goal === 'gain' ? 1.8 : 1.6;
  const protein = Math.round(clamp(weight * proteinPerKg, 60, 240));
  const fat = Math.round(clamp((calories * 0.27) / 9, 35, 130));
  const carbs = Math.max(50, Math.round((calories - protein * 4 - fat * 9) / 4));
  return {
    bmr: Math.round(bmr),
    tdee: Math.round(tdee),
    calories,
    protein,
    carbs,
    fat,
    safeMin,
    unsafe,
    goalDelta
  };
}

function getInsights(user) {
  const p = user.profile || {};
  const base = baseTargets(user);
  const alerts = [];
  const adjustments = { days: 0, sets: 0, calorie: 0, protein: 0 };
  const planned = clamp(Number(p.daysPerWeek) || 3, 1, 7);
  const trainedDays = new Set(workoutsLast7(user).map(workout => workout.date)).size;
  const missed = Math.max(0, planned - trainedDays);

  if (user.logs.workouts.length) {
    if (missed >= 3) {
      adjustments.days = missed >= 5 ? -2 : -1;
      adjustments.sets = -1;
      alerts.push({
        level: 'warn',
        title: `You missed ${missed} planned workouts this week`,
        body: `You trained ${trainedDays} of ${planned} planned days. Life happens — consistency matters more than perfection, and a 15-minute session still counts.`,
        fix: `Your plan is automatically reduced to ${Math.max(1, planned + adjustments.days)} days this week. Put the session in your calendar and treat it like an appointment.`
      });
    } else if (missed === 2) {
      alerts.push({
        level: 'info',
        title: 'Two sessions slipped this week',
        body: 'You are close to your target, so one strong session can put you back on track.',
        fix: 'Schedule a 20-minute full-body session in the next 48 hours and keep the warm-up short.'
      });
    } else if (trainedDays >= planned) {
      alerts.push({
        level: 'good',
        title: 'You hit your training target',
        body: `${trainedDays} sessions logged against ${planned} planned days. That consistency is what drives progress.`,
        fix: 'Keep the same schedule next week and add a small amount of load or one extra rep where form stays clean.'
      });
    }
  }

  // Completed days only: today is usually a partial food log and would make
  // the weekly average (and any alert based on it) misleading.
  const foodDays = loggedDays(user, 7).filter(day => day.date !== today());
  if (foodDays.length >= 3) {
    const avgCalories = foodDays.reduce((sum, day) => sum + day.calories, 0) / foodDays.length;
    const avgProtein = foodDays.reduce((sum, day) => sum + day.protein, 0) / foodDays.length;
    if (p.goal === 'lose' && avgCalories > base.calories + 250) {
      adjustments.calorie = -100;
      alerts.push({
        level: 'warn',
        title: 'Calories are running above target',
        body: `Your logged average is ${Math.round(avgCalories)} kcal against a ${base.calories} kcal target. A small daily gap adds up over a week.`,
        fix: 'Tighten portion sizes at one meal rather than skipping meals. Your target has been nudged down by 100 kcal this week.'
      });
    } else if (avgCalories < base.calories - 350) {
      adjustments.calorie = 150;
      alerts.push({
        level: 'warn',
        title: 'You are eating well below target',
        body: `Your logged average is ${Math.round(avgCalories)} kcal against a ${base.calories} kcal target. Under-fuelling can hurt recovery and muscle retention.`,
        fix: 'Add a protein-rich snack such as yogurt, eggs or a shake. Your target has been raised by 150 kcal this week.'
      });
    }
    if (avgProtein < base.protein * 0.7) {
      adjustments.protein = 10;
      alerts.push({
        level: 'info',
        title: 'Protein is below your target',
        body: `You are averaging ${Math.round(avgProtein)} g protein against a ${base.protein} g target. Protein protects muscle and keeps you full.`,
        fix: 'Anchor each meal with a palm-sized portion of protein. The daily target has been raised slightly for the next week.'
      });
    }
    if (p.goal === 'lose' && avgCalories <= base.calories + 150 && avgProtein >= base.protein * 0.9) {
      alerts.push({
        level: 'good',
        title: 'Nutrition is matching the plan',
        body: 'Your recent calories and protein are close to target on the days you logged.',
        fix: 'Keep logging the same way and review the weekly average rather than a single day.'
      });
    }
  }

  const recentWeights = sortedWeights(user).filter(entry => entry.date >= dateOffset(-28));
  if (recentWeights.length >= 2) {
    const first = recentWeights[0];
    const last = recentWeights[recentWeights.length - 1];
    const spanDays = Math.round((new Date(last.date) - new Date(first.date)) / 86400000);
    if (spanDays >= 7) {
      const perWeek = ((Number(last.kg) - Number(first.kg)) / spanDays) * 7;
      const wrongWay = (p.goal === 'lose' && perWeek > 0.25) ||
        ((p.goal === 'gain' || p.goal === 'build') && perWeek < -0.25);
      if (wrongWay) {
        alerts.push({
          level: 'warn',
          title: 'Weight is trending the wrong way',
          body: `Your weigh-ins are moving ${perWeek > 0 ? 'up' : 'down'} by about ${Math.abs(round(perWeek, 2))} kg per week over the last ${spanDays} days, while your goal is ${(GOAL_LABELS[p.goal] || 'maintain').toLowerCase()}.`,
          fix: p.goal === 'lose'
            ? 'Check portion sizes, drinks and weekend meals before cutting calories further. Keep protein high and review the trend over two weeks, not one weigh-in.'
            : 'Add one calorie-dense meal or snack (oats, nuts, yogurt, rice) and reduce optional cardio. If the trend continues, review your target with a professional.'
        });
      }
    }
  }

  const sleepAvg = sleepAverage(user);
  if (sleepAvg !== null && sleepAvg < 6.5) {
    adjustments.sets = Math.min(adjustments.sets, -1);
    alerts.push({
      level: 'warn',
      title: 'Sleep is limiting recovery',
      body: `You are averaging ${round(sleepAvg, 1)} hours. Short sleep raises perceived effort and slows recovery.`,
      fix: 'Set a consistent wake time, dim screens an hour before bed, and keep this week’s training volume slightly lower.'
    });
  }

  return { alerts, adjustments };
}

function targets(user) {
  const base = baseTargets(user);
  const insights = getInsights(user);
  const adjustments = insights.adjustments;
  const calories = Math.round(clamp(base.calories + (adjustments.calorie || 0), base.safeMin, 5000) / 10) * 10;
  const protein = Math.round(clamp(base.protein + (adjustments.protein || 0), 60, 260));
  const fat = Math.round(clamp((calories * 0.27) / 9, 35, 130));
  const carbs = Math.max(50, Math.round((calories - protein * 4 - fat * 9) / 4));
  return { ...base, calories, protein, carbs, fat, adjustments };
}

      <div class="stat"><div class="stat-value">${sleep === null ? '—' : round(sleep, 1)}<small>h</small></div><div class="stat-label">Sleep average</div><div class="stat-sub">${streak} day logging streak</div></div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-head">
          <h2>Today's plan</h2>
          <span class="pill">${WEEKDAY_NAMES[weekday]}</span>
        </div>
        <h3 style="margin-bottom:2px">${esc(todayPlan.label)} ${todayPlan.recovery ? '<span class="badge">Active recovery</span>' : ''}</h3>
        <div class="tiny muted">${esc(todayPlan.focus)} · ${todayPlan.exercises.length} exercises</div>
        ${todayPlan.rest ? `
          <p class="small muted" style="margin-top:12px">Rest is part of the plan. Walk, stretch, meal-prep or simply recover — your next session will be there tomorrow.</p>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-sm" data-action="goto-tab" data-tab="trainer">See the week</button>
          </div>` : `
          <div class="today-plan-list">
            ${todayPlan.exercises.slice(0, 5).map(exercise => `
              <div class="today-row">
                <span>${esc(exercise.name)}</span>
                <span class="muted">${exercise.sets} × ${exercise.reps}</span>
              </div>`).join('')}
          </div>
          ${todayPlan.finisher ? `<div class="tiny muted" style="margin-top:9px">Finisher: ${esc(todayPlan.finisher)}</div>` : ''}
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-sm btn-primary" data-action="log-workout" data-day="${weekday}">${todayPlan.recovery ? 'Log recovery session' : 'Log workout'}</button>
            <button class="btn btn-sm btn-ghost" data-action="goto-tab" data-tab="trainer">Open trainer</button>
          </div>`}
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Coach's notes</h2>
          <span class="pill ${alertsToShow.length ? 'warn' : 'good'}">${alertsToShow.length ? `${alertsToShow.length} to review` : 'All clear'}</span>
        </div>
        <div class="alert-stack">${renderAlerts(shownAlerts, 3)}</div>
        ${insights.alerts.length > 3 ? `<p class="tiny muted" style="margin-top:9px">+ ${insights.alerts.length - 3} more note${insights.alerts.length - 3 === 1 ? '' : 's'} in the relevant sections. The plan has already adjusted.</p>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Quick actions</h2></div>
      <div class="btn-row">
        <button class="btn btn-sm" data-action="goto-tab" data-tab="nutritionist">Log food</button>
        <button class="btn btn-sm" data-action="goto-tab" data-tab="progress">Log weight</button>
        <button class="btn btn-sm" data-action="goto-tab" data-tab="chef">Find a recipe</button>
        <button class="btn btn-sm" data-action="goto-tab" data-tab="doctor">Log water</button>
      </div>
    </div>`;
}

/* Workout plan generation ------------------------------------------------ */
const WEEKDAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const WEEK_ASSIGN = {
  1: [2],
  2: [0, 3],
  3: [0, 2, 4],
  4: [0, 1, 3, 4],
  5: [0, 1, 2, 4, 5],
  6: [0, 1, 2, 3, 4, 5],
  7: [0, 1, 2, 3, 4, 5, 6]
};

// Injury-aware filtering. These are conservative movement swaps, not medical
// advice: the app removes exercises that commonly aggravate the area named.
const INJURY_RULES = [
  {
    words: ['back', 'lumbar', 'spine', 'disc', 'sciatica'],
    avoid: ['barbell deadlift', 'romanian deadlift', 'barbell row', 'kettlebell swing', 'good morning', 'bent-over']
  },
  {
    words: ['knee', 'patella', 'acl', 'meniscus'],
    avoid: ['barbell back squat', 'leg press', 'walking lunge', 'bulgarian split squat', 'reverse lunge', 'smith machine squat', 'wall sit']
  },
  {
    words: ['shoulder', 'rotator', 'deltoid'],
    avoid: ['overhead press', 'shoulder press', 'pike push-up', 'lateral raise', 'triceps dip', 'pull-up', 'chin-up', 'upright row']
  },
  {
    words: ['wrist', 'carpal'],
    avoid: ['push-up', 'incline push-up', 'bench press', 'floor press', 'plank', 'triceps dip']
  },
  {
    words: ['ankle', 'achilles', 'foot', 'plantar'],
    avoid: ['calf raise', 'walking lunge', 'reverse lunge', 'bulgarian split squat', 'step-up']
  },
  {
    words: ['elbow', 'tendinitis', 'tendonitis'],
    avoid: ['dumbbell curl', 'hammer curl', 'band curl', 'preacher curl', 'overhead triceps extension', 'triceps dip', 'skull crusher']
  },
  {
    words: ['hip', 'groin'],
    avoid: ['bulgarian split squat', 'walking lunge', 'reverse lunge', 'barbell back squat', 'leg press', 'hip abduction']
  }
];

function injuryAvoids(exercise, injuries) {
  const text = String(injuries || '').toLowerCase();
  if (!text.trim()) return false;
  const name = exercise.name.toLowerCase();
  return INJURY_RULES.some(rule =>
    rule.words.some(word => text.includes(word)) &&
    rule.avoid.some(fragment => name.includes(fragment))
  );
}

function planMode() {
  return state.trainerMode === 'home' ? 'home' : 'gym';
}

function hasEquipment(exercise, profile, mode) {
  if (mode === 'gym') return true; // the gym plan assumes a standard gym floor
  if (exercise.equip.includes('bodyweight')) return true;
  const owned = profile.equipment || [];
  return exercise.equip.some(tag =>
    (tag === 'dumbbells' || tag === 'bands' || tag === 'kettlebell') && owned.includes(tag)
  );
}

function equipmentScore(exercise, mode) {
  if (mode === 'gym') {
    if (exercise.equip.includes('gym')) return 4;
    if (exercise.equip.includes('barbell')) return 3;
    if (exercise.equip.includes('dumbbells') || exercise.equip.includes('kettlebell')) return 2;
    return 1;
  }
  if (exercise.equip.includes('bodyweight')) return 4;
  if (exercise.equip.includes('bands')) return 3;
  return 2;
}

function repRangeFor(goal) {
  if (goal === 'lose') return '12–15';
  if (goal === 'maintain') return '10–12';
  return '8–12';
}

// Suggest a small weight jump when the top of the rep range is reached.
function overloadHint(user, exerciseName, reps) {
  const u = user || state.user;
  const p = u && u.profile || {};
  const goal = p.goal || 'maintain';
  const experience = p.experience || 'beginner';
  // If reps suggest we've hit the top of the range, suggest a small weight increase
  const topOfRange = goal === 'lose' ? 15 : goal === 'maintain' ? 12 : 8;
  if (reps && Number(reps) >= topOfRange) {
    const exercise = EXERCISES.find(ex => ex.name === exerciseName);
    if (exercise && exercise.equip.includes('dumbbells')) {
      return `When you can do ${topOfRange} reps easily, add 2.5 kg (or a harder variation).`;
    }
  }
  return '';
}

// Isometric holds are prescribed in seconds rather than reps.
const HOLD_EXERCISES = new Set(['Plank', 'Side plank', 'Wall sit']);

function planTemplates(days) {
  const full = { focus: 'Full body', slots: ['squat', 'pushH', 'pullH', 'hinge', 'pushV', 'core'], max: 6 };
  const upper = { focus: 'Upper body', slots: ['pushH', 'pullH', 'pushV', 'pullV', 'lateral', 'biceps', 'triceps', 'core'], max: 7 };
  const lower = { focus: 'Lower body', slots: ['squat', 'hinge', 'lunge', 'glutes', 'calves', 'core'], max: 6 };
  const push = { focus: 'Chest, shoulders & triceps', slots: ['pushH', 'pushV', 'lateral', 'triceps', 'core'], max: 5 };
  const pull = { focus: 'Back, rear shoulders & biceps', slots: ['pullH', 'pullV', 'rear', 'biceps', 'core'], max: 5 };
  const legs = { focus: 'Legs & glutes', slots: ['squat', 'hinge', 'lunge', 'glutes', 'calves', 'core'], max: 6 };

  if (days === 1) return [{ ...full, label: 'Full Body' }];
  if (days === 2) return [
    { ...upper, label: 'Upper Body' },
    { ...lower, label: 'Lower Body' }
  ];
  if (days === 3) return [
    { ...push, label: 'Push' },
    { ...pull, label: 'Pull' },
    { ...legs, label: 'Legs' }
  ];
  if (days === 4) return [
    { ...upper, label: 'Upper A' },
    { ...lower, label: 'Lower A' },
    { ...upper, label: 'Upper B' },
    { ...lower, label: 'Lower B' }
  ];
  if (days === 5) return [
    { ...push, label: 'Push' },
    { ...pull, label: 'Pull' },
    { ...legs, label: 'Legs' },
    { ...upper, label: 'Upper' },
    { ...lower, label: 'Lower' }
  ];
  if (days === 6) return [
    { ...push, label: 'Push A' },
    { ...pull, label: 'Pull A' },
    { ...legs, label: 'Legs A' },
    { ...push, label: 'Push B' },
    { ...pull, label: 'Pull B' },
    { ...legs, label: 'Legs B' }
  ];
  return [
    { ...push, label: 'Push A' },
    { ...pull, label: 'Pull A' },
    { ...legs, label: 'Legs A' },
    { ...upper, label: 'Upper' },
    { ...lower, label: 'Lower' },
    { ...full, label: 'Full Body' },
    { recovery: true, label: 'Active Recovery', focus: 'Mobility, walking & breathing', slots: [], max: 0 }
  ];
}

function chooseExercises(template, user, variant, adjustments, mode) {
  const p = user.profile;
  const sets = clamp((p.experience === 'beginner' ? 3 : 4) + adjustments.sets, 2, 5);
  const reps = repRangeFor(p.goal);
  const rest = p.goal === 'lose' ? 45 : p.goal === 'maintain' ? 60 : 90;
  const picks = [];

  template.slots.forEach(slot => {
    const options = EXERCISES
      .filter(ex => ex.slots.includes(slot))
      .filter(ex => hasEquipment(ex, p, mode))
      .filter(ex => !injuryAvoids(ex, p.injuries))
      .sort((a, b) => equipmentScore(b, mode) - equipmentScore(a, mode));

    if (!options.length) return;
    let exercise = options[variant % options.length];
    if (picks.some(pick => pick.name === exercise.name)) {
      exercise = options[(variant + 1) % options.length];
    }
    if (picks.some(pick => pick.name === exercise.name)) return;
    picks.push({
      name: exercise.name,
      sets,
      rest,
      cues: exercise.cues,
      reps: HOLD_EXERCISES.has(exercise.name) ? '30–45 sec' : reps
    });
  });

  return picks.slice(0, template.max);
}

function recoveryExercises() {
  return [
    { name: 'Easy walk', sets: 1, reps: '15–20 min', rest: 0, cues: 'Keep a conversational pace. The goal is blood flow, not a calorie burn.' },
    { name: 'Cat-cow', sets: 2, reps: '8–10 slow reps', rest: 20, cues: 'Move your spine gently through flexion and extension without forcing the range.' },
    { name: 'Hip flexor stretch', sets: 2, reps: '30 sec each side', rest: 15, cues: 'Tuck your pelvis slightly and keep your ribs down; you should feel the front of the hip, not the lower back.' },
    { name: 'Thoracic rotation', sets: 2, reps: '8 each side', rest: 15, cues: 'Sit or kneel tall, rotate through the upper back and follow your hand with your eyes.' },
    { name: 'Box breathing', sets: 1, reps: '2–3 min', rest: 0, cues: 'Inhale for four, hold for four, exhale for four, hold for four. Keep the shoulders relaxed.' }
  ];
}

function buildPlan(user) {
  const p = user.profile;
  const mode = planMode();
  const insights = getInsights(user);
  const requested = clamp(Number(p.daysPerWeek) || 3, 1, 7);
  const days = clamp(requested + insights.adjustments.days, 1, 7);
  const templates = planTemplates(days);
  const assignment = WEEK_ASSIGN[days] || WEEK_ASSIGN[3];
  const schedule = WEEKDAY_NAMES.map((name, index) => ({
    weekday: index, weekdayName: name, rest: true, recovery: false,
    label: 'Rest & recover', focus: '', exercises: [], finisher: ''
  }));

  assignment.forEach((weekday, index) => {
    const template = templates[index];
    if (template.recovery) {
      schedule[weekday] = {
        weekday,
        weekdayName: WEEKDAY_NAMES[weekday],
        rest: false,
        recovery: true,
        label: template.label,
        focus: template.focus,
        exercises: recoveryExercises(),
        finisher: 'A short easy walk later in the day is optional.'
      };
      return;
    }
    schedule[weekday] = {
      weekday,
      weekdayName: WEEKDAY_NAMES[weekday],
      rest: false,
      recovery: false,
      label: template.label,
      focus: template.focus,
      exercises: chooseExercises(template, user, index, insights.adjustments, mode),
      finisher: p.goal === 'lose'
        ? '10 min brisk walk or easy bike'
        : p.goal === 'maintain'
          ? '5 min easy cool-down walk'
          : '5 min easy walk to finish'
    };
  });

  const trainingDays = templates.filter(template => !template.recovery).length;
  return { days, trainingDays, schedule, adjustments: insights.adjustments, mode, injuries: p.injuries || '' };
}

/* ---------- Nutritionist ---------- */
function macroBar(label, value, target, unit) {
  const pct = target > 0 ? clamp((value / target) * 100, 0, 100) : 0;
  const over = target > 0 && value > target * 1.1;
  return `
    <div class="macro-bar">
      <div class="macro-head"><span>${label}</span><span>${Math.round(value)} / ${Math.round(target)} ${unit}</span></div>
      <div class="progress ${over ? 'warn' : 'good'}"><span style="width:${pct}%"></span></div>
    </div>`;
}
function renderNutritionist() {
  const u = state.user;
  const p = u.profile;
  const t = targets(u);
  const todayEntries = u.logs.food.filter(entry => entry.date === today());
  const totals = totalsForEntries(todayEntries);
  const meals = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
  const summaryDays = [];
  for (let i = 6; i >= 0; i--) {
    const date = dateOffset(-i);
    const entries = u.logs.food.filter(entry => entry.date === date);
    summaryDays.push({ date, entries: entries.length, ...totalsForEntries(entries) });
  }
  const logged = summaryDays.filter(day => day.entries > 0);
  const avg = logged.length ? {
    calories: logged.reduce((s, d) => s + d.calories, 0) / logged.length,
    protein: logged.reduce((s, d) => s + d.protein, 0) / logged.length,
    carbs: logged.reduce((s, d) => s + d.carbs, 0) / logged.length,

  const adjusted = Object.values(t.adjustments).some(value => value !== 0);

  return `

      <div>

    ${t.unsafe ? `<div class="warning-banner"><strong>Unsafe calorie target flagged.</strong> Your goal calculation falls below a conservative safety floor. The target shown has been raised to ${t.safeMin} kcal, and we strongly recommend talking to a doctor or registered dietitian before pursuing an aggressive deficit.</div>` : ''}

      <div class="card"><div class="stat-label">TDEE</div><div class="stat-value" style="margin-top:4px">${t.tdee}<small>kcal</small></div><p class="tiny muted" style="margin-top:4px">Estimated maintenance with activity.</p></div>
      <div class="card"><div class="stat-label">Daily calorie target</div><div class="stat-value" style="margin-top:4px">${t.calories}<small>kcal</small></div><p class="tiny muted" style="margin-top:4px">${p.goal === 'lose' ? 'Moderate deficit for fat loss.' : p.goal === 'gain' ? 'Controlled surplus for weight gain.' : p.goal === 'build' ? 'Small surplus to support muscle.' : 'Maintenance range.'}</p></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Today's targets</h2>
        <span class="pill ${adjusted ? 'warn' : 'good'}">${adjusted ? 'Auto-adjusted' : 'On plan'}</span>
      </div>
      <div class="grid grid-2">
        <div>
          ${macroBar('Calories', totals.calories, t.calories, 'kcal')}
          ${macroBar('Protein', totals.protein, t.protein, 'g')}

        <div>
          ${macroBar('Carbs', totals.carbs, t.carbs, 'g')}
          ${macroBar('Fat', totals.fat, t.fat, 'g')}
        </div>
      </div>
      ${adjusted ? `<div class="alert info" style="margin-top:14px"><div class="alert-title">Targets adjusted from your logs</div><p>${[
        t.adjustments.calorie ? `${t.adjustments.calorie > 0 ? '+' : ''}${t.adjustments.calorie} kcal` : '',
        t.adjustments.protein ? `+${t.adjustments.protein} g protein` : ''

    </div>

    <div class="card">
      <div class="card-head"><h2>Log food</h2><span class="pill">${todayEntries.length} entries today</span></div>

      ${todayEntries.length ? meals.map(meal => {

        return `<div class="meal-title">${meal}</div>${entries.map(entry => `

          </div>`).join('')}`;
      }).join('') : `<div class="empty">Nothing logged today. Add your first meal above — even an estimate is better than nothing.</div>`}
    </div>

    <div class="card">
      <div class="card-head"><h2>Weekly summary</h2><span class="pill">${logged.length} day${logged.length === 1 ? '' : 's'} logged</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Day</th><th class="num">Calories</th><th class="num">Protein</th><th class="num">Carbs</th><th class="num">Fat</th><th>Vs target</th></tr></thead>

                <td class="num">${day.entries ? Math.round(day.fat) + ' g' : '—'}</td>
                <td>${day.entries ? `<span class="badge ${Math.abs(diff) <= 150 ? 'good' : Math.abs(diff) <= 350 ? 'warn' : 'bad'}">${diff > 0 ? '+' : ''}${diff} kcal</span>` : '<span class="badge">No log</span>'}</td>
              </tr>`;

      ${avg ? `<p class="small muted" style="margin-top:10px">Average on logged days: <b>${Math.round(avg.calories)} kcal</b> · P ${Math.round(avg.protein)} g · C ${Math.round(avg.carbs)} g · F ${Math.round(avg.fat)} g. Target: ${t.calories} kcal / ${t.protein} g protein.</p>` : ''}

}

/* ---------- Chef ---------- */
function renderChef() {
  const u = state.user;
  const p = u.profile;
  const t = targets(u);
  const safeRecipes = RECIPES.filter(recipe => fitsDiet(recipe, p.diet) && allergenFree(recipe, p.allergies));
  const filters = state.chefFilters;
  const filtered = safeRecipes.filter(recipe => {
    const cuisineOk = filters.cuisine === 'All' || recipe.cuisine === filters.cuisine;
    const dietOk = filters.diet === 'All' || (recipe.diets || []).includes(filters.diet);
    const mealOk = filters.meal === 'All' || recipe.meal === filters.meal;
    return cuisineOk && dietOk && mealOk;
  });
  const mealCalories = t.calories / 3;
  const suggestions = [...filtered].sort((a, b) => {
    const aScore = Math.abs(a.cal - mealCalories) - a.p * 2;
    const bScore = Math.abs(b.cal - mealCalories) - b.p * 2;
    return aScore - bScore;
  });
  const filterBits = [];
  if (p.diet) filterBits.push(`${DIET_LABELS[normalizeDiet(p.diet)] || 'Non-Vegetarian'} preference`);
  if (p.allergies) filterBits.push(`excluding ${p.allergies}`);
  const activeFilters = [
    filters.cuisine !== 'All' ? filters.cuisine : '',
    filters.diet !== 'All' ? (DIET_FILTERS.find(([value]) => value === filters.diet) || [])[1] : '',
    filters.meal !== 'All' ? filters.meal : ''
  ].filter(Boolean);
  const matchResults = state.chefIngredients
    ? safeRecipes.map(recipe => ({ recipe, match: recipeMatchScore(recipe, state.chefIngredients) }))
      .filter(item => item.match && item.match.matched.length > 0)
      .sort((a, b) => b.match.ratio - a.match.ratio || b.match.matched.length - a.match.matched.length)
      .slice(0, 5)
    : [];

  return `
    <div class="section-head">
      <div>
        <h1>Chef</h1>

      </div>
      <span class="pill accent">${safeRecipes.length} safe recipes</span>
    </div>

    ${filterBits.length ? `<div class="alert info"><div class="alert-title">Filtered for your profile</div><p>${esc(filterBits.join(' · '))}. Recipes outside your diet or containing a listed allergen are hidden before the filters below are applied. Always read labels on packaged ingredients — recipes are guidance, not allergy guarantees.</p></div>` : ''}

    <div class="card">
      <div class="card-head"><h2>Find a dish</h2><span class="pill">${filtered.length} of ${safeRecipes.length} safe recipes</span></div>
      <div class="filter-bar">
        <div class="field">
          <label for="chef-cuisine">Cuisine</label>
          <select id="chef-cuisine" data-change="chef-cuisine">
            ${CUISINES.map(item => `<option value="${esc(item)}" ${selected(item, filters.cuisine)}>${item === 'All' ? 'All cuisines' : esc(item)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="chef-diet">Diet</label>
          <select id="chef-diet" data-change="chef-diet">
            ${DIET_FILTERS.map(([value, label]) => `<option value="${esc(value)}" ${selected(value, filters.diet)}>${esc(label)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="chef-meal">Meal type</label>
          <select id="chef-meal" data-change="chef-meal">
            ${MEAL_TYPES.map(item => `<option value="${esc(item)}" ${selected(item, filters.meal)}>${item === 'All' ? 'All meals' : esc(item)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="filter-summary">
        ${activeFilters.length
          ? activeFilters.map(item => `<span class="chip good">${esc(item)}</span>`).join('') + '<button class="btn btn-xs btn-ghost" data-action="clear-chef-filters">Clear filters</button>'
          : '<span class="tiny muted">Showing every recipe that fits your diet and allergy profile. Combine filters to narrow it down.</span>'}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Cook with what I have</h2></div>
      <form data-form="chef-ingredients">
        <div class="form-grid">
          <div class="field span-2">
            <label for="chef-ingredients">Your ingredients (separate with commas)</label>

          </div>
        </div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn btn-primary btn-sm" type="submit">Find recipes</button>
          ${state.chefIngredients ? '<button class="btn btn-ghost btn-sm" type="button" data-action="clear-ingredients">Clear</button>' : ''}
        </div>
      </form>
      ${state.chefIngredients ? `
        <div style="margin-top:16px">
          ${matchResults.length ? matchResults.map(({ recipe, match }) => `
            <div class="card tight" style="margin-top:9px">
              <div class="recipe-top">
                <div>
                  <div class="recipe-name">${esc(recipe.name)}</div>
                  <div class="tiny muted">${esc(recipe.cuisine)} · ${esc(recipe.meal)} · ${recipe.time} min</div>

                <span class="badge ${match.ratio === 1 ? 'good' : 'warn'}">${match.matched.length}/${recipe.ingredients.length} ingredients</span>

                ${match.matched.map(item => `<span class="chip good">Have: ${esc(item.name)}</span>`).join('')}

/* ---------------------------------------------------------------------------
   Charts — lightweight canvas charts, no chart library required.
   --------------------------------------------------------------------------- */
function prepareCanvas(canvas) {
  if (!canvas) return null;
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}
function drawLineChart(canvas, points, options = {}) {
  const prepared = prepareCanvas(canvas);
  if (!prepared || !points.length) return;
  const { ctx, w, h } = prepared;
  const pad = { l: 40, r: 14, t: 16, b: 28 };
  const values = points.map(point => Number(point.value));
  if (options.target) values.push(Number(options.target));
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const extra = (max - min) * 0.15;
  min -= extra; max += extra;
  const xFor = index => points.length === 1
    ? pad.l + (w - pad.l - pad.r) / 2
    : pad.l + (index / (points.length - 1)) * (w - pad.l - pad.r);
  const yFor = value => pad.t + ((max - value) / (max - min)) * (h - pad.t - pad.b);
  const accent = options.color || cssVar('--accent');
  const text = cssVar('--muted');
  const line = cssVar('--line');

  ctx.clearRect(0, 0, w, h);
  ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
  ctx.fillStyle = text;
  ctx.strokeStyle = line;
  ctx.lineWidth = 1;

  // Horizontal grid + y labels.
  for (let i = 0; i <= 3; i++) {
    const value = min + ((max - min) * i) / 3;
    const y = yFor(value);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(w - pad.r, y);
    ctx.stroke();
    ctx.fillStyle = text;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${round(value, 1)}`, pad.l - 7, y);
  }

  // Target line.
  if (options.target) {
    const y = yFor(Number(options.target));
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = cssVar('--good');
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(w - pad.r, y);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = cssVar('--good');
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('goal', pad.l + 4, y - 3);
  }

  // Area fill under the line.
  const gradient = ctx.createLinearGradient(0, pad.t, 0, h - pad.b);
  gradient.addColorStop(0, `${accent}3d`);
  gradient.addColorStop(1, `${accent}00`);
  ctx.beginPath();
  points.forEach((point, index) => {
    const x = xFor(index);
    const y = yFor(Number(point.value));
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.lineTo(xFor(points.length - 1), h - pad.b);
  ctx.lineTo(xFor(0), h - pad.b);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  // Main line.
  ctx.beginPath();
  points.forEach((point, index) => {
    const x = xFor(index);
    const y = yFor(Number(point.value));
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Points.
  points.forEach((point, index) => {
    const x = xFor(index);
    const y = yFor(Number(point.value));
    ctx.beginPath();
    ctx.arc(x, y, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = cssVar('--panel');
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // X labels: all if few points, otherwise first / middle / last.
  ctx.fillStyle = text;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'center';
  const labelIndices = points.length <= 6
    ? points.map((_, i) => i)
    : [0, Math.floor((points.length - 1) / 2), points.length - 1];
  labelIndices.forEach(index => {
    ctx.fillText(points[index].label, xFor(index), h - pad.b + 8);
  });
}
function drawBarChart(canvas, points, options = {}) {
  const prepared = prepareCanvas(canvas);
  if (!prepared) return;
  const { ctx, w, h } = prepared;
  const pad = { l: 32, r: 12, t: 16, b: 28 };
  const maxValue = Math.max(1, ...points.map(point => Number(point.value)));
  const top = Math.ceil(maxValue / 2) * 2;
  const text = cssVar('--muted');
  const line = cssVar('--line');
  const accent = options.color || cssVar('--good');

  ctx.clearRect(0, 0, w, h);
  ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
  ctx.strokeStyle = line;
  ctx.fillStyle = text;

  for (let i = 0; i <= 2; i++) {
    const value = (top * i) / 2;
    const y = pad.t + ((top - value) / top) * (h - pad.t - pad.b);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(w - pad.r, y);
    ctx.stroke();
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${value}`, pad.l - 6, y);
  }

  const slot = (w - pad.l - pad.r) / points.length;
  const barWidth = Math.max(6, Math.min(30, slot * 0.55));
  points.forEach((point, index) => {
    const value = Number(point.value);
    const x = pad.l + slot * index + (slot - barWidth) / 2;
    const barHeight = (value / top) * (h - pad.t - pad.b);
    const y = h - pad.b - barHeight;
    const gradient = ctx.createLinearGradient(0, y, 0, h - pad.b);
    gradient.addColorStop(0, accent);
    gradient.addColorStop(1, `${accent}88`);
    ctx.fillStyle = gradient;
    const radius = Math.min(5, barWidth / 2);
    ctx.beginPath();
    ctx.moveTo(x, h - pad.b);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.lineTo(x + barWidth - radius, y);
    ctx.quadraticCurveTo(x + barWidth, y, x + barWidth, y + radius);
    ctx.lineTo(x + barWidth, h - pad.b);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = text;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(point.label, x + barWidth / 2, h - pad.b + 8);
  });
}
function workoutsPerWeek(user, weeks = 8) {
  const start = parseDate(weekStart());
  const result = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const monday = new Date(start);
    monday.setDate(start.getDate() - i * 7);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    const count = user.logs.workouts.filter(workout =>
      workout.date >= isoDate(monday) && workout.date <= isoDate(sunday)
    ).length;
    result.push({
      label: monday.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
      value: count
    });
  }
  return result;
}
function drawCharts() {
  if (!state.user || state.tab !== 'progress') return;
  const u = state.user;
  const weights = sortedWeights(u);
  drawLineChart(
    $('#weightChart'),
    weights.map(entry => ({ label: prettyDate(entry.date), value: entry.kg })),
    { target: u.profile.targetWeight || null, color: cssVar('--accent') }
  );
  const measures = [...u.logs.measurements]
    .filter(entry => Number(entry[state.measure]) > 0)
    .sort((a, b) => a.date.localeCompare(b.date));
  drawLineChart(
    $('#measureChart'),
    measures.map(entry => ({ label: prettyDate(entry.date), value: Number(entry[state.measure]) })),
    { color: cssVar('--accent') }
  );
  drawBarChart($('#workoutChart'), workoutsPerWeek(u), { color: cssVar('--good') });
}

function openModal(modal) {
  state.modal = modal;
  document.body.style.overflow = 'hidden';
  renderModal();
}
function closeModal() {
  state.modal = null;
  const root = $('#modal-root');
  if (root) root.innerHTML = '';
  document.body.style.overflow = '';
}
function renderModal() {
  const root = $('#modal-root');
  if (!root) return;
  if (!state.modal) { root.innerHTML = ''; return; }
  if (state.modal.type === 'settings') root.innerHTML = settingsModalMarkup();
  else if (state.modal.type === 'workout') root.innerHTML = workoutModalMarkup();
  else if (state.modal.type === 'recipe') root.innerHTML = recipeModalMarkup();
}

function lastExerciseLog(user, name) {
  const workouts = [...user.logs.workouts].sort((a, b) => a.date.localeCompare(b.date));
  for (let i = workouts.length - 1; i >= 0; i--) {
    const exercise = workouts[i].exercises?.find(item => item.name === name);
    if (exercise) return exercise;
  }
  return null;
}
