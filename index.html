<style>
/* ============================================================
   Trainer4U — all styling is in this single file.
   Mobile-first, CSS-variable based light/dark theme.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
:root {
  color-scheme: dark;
  --bg: #0F172A;
  --bg-2: #111827;
  --panel: #0F172A;
  --panel-2: #1A2332;
  --text: #E8F5E9;
  --muted: #A8B3C7;
  --line: rgba(255, 255, 255, .12);
  --accent: #881337;
  --accent-soft: rgba(253, 164, 175, .16);
  --accent-ink: #FDA4AF;
  --good: #4ADE80;
  --good-soft: rgba(74, 222, 128, .14);
  --warn: #FBBF24;
  --bad: #FDA4AF;
  --chart-contrast: #0F172A;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .40);
  --shadow: 0 1px 2px rgba(0, 0, 0, .40), 0 18px 38px -18px rgba(0, 0, 0, .80);
  --radius: 20px;
  --radius-sm: 12px;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #F8FAFC;
  --bg-2: #F1F5F9;
  --panel: #E8F5E9;
  --panel-2: #F1F8F8;
  --text: #0F172A;
  --muted: #4B5563;
  --line: #D8DEE8;
  --accent: #881337;
  --accent-soft: #FDE8F0;
  --accent-ink: #881337;
  --good: #166534;
  --good-soft: #DCFCE7;
  --warn: #854D0E;
  --bad: #BE123C;
  --chart-contrast: #0F172A;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 14px 30px -18px rgba(0, 0, 0, .15);
  --radius: 20px;
  --radius-sm: 12px;
}
/* Cards are light green in both themes; the shell stays navy in the default theme. */
.card, .stat, .modal, .auth-card, .onboard {
  --panel: #E8F5E9;
  --panel-2: #F1F8F8;
  --text: #0F172A;
  --muted: #4B5563;
  --line: #D8DEE8;
  --good: #166534;
  --good-soft: #DCFCE7;
  --warn: #854D0E;
  --bad: #BE123C;
  --accent-ink: #881337;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .06);
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 16px 34px -20px rgba(0, 0, 0, .38);
  color: var(--text);
}
body {
  margin: 0;
  min-height: 100vh;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
  background:
    radial-gradient(900px 520px at 8% -10%, rgba(136, 19, 55, .32), transparent 60%),
    radial-gradient(760px 420px at 100% 0%, rgba(136, 19, 55, .18), transparent 55%),
    var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
html[data-theme="light"] body {
  background:
    radial-gradient(900px 520px at 8% -10%, rgba(136, 19, 55, .08), transparent 60%),
    radial-gradient(760px 420px at 100% 0%, rgba(15, 23, 42, .06), transparent 55%),
    var(--bg);
}
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: clamp(1.45rem, 4vw, 2rem); letter-spacing: -.03em; line-height: 1.15; }
h2 { font-size: 1.08rem; letter-spacing: -.015em; }
h3 { font-size: .98rem; letter-spacing: -.01em; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }
.tiny { font-size: .72rem; }
.w-full { width: 100%; }
.hidden { display: none !important; }

/* ---------- Header + tabs ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; max-width: 1140px; margin: 0 auto; padding: 14px 16px 8px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 850; font-size: 1.12rem; letter-spacing: -.025em; color: var(--text); }
.logo {
  width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;
  background: #0F172A; overflow: hidden; flex: 0 0 auto;
  box-shadow: 0 10px 22px -12px rgba(0, 0, 0, .9);
  border: 1px solid rgba(255, 255, 255, .12);
}
.logo svg { width: 100%; height: 100%; display: block; }
.brand-accent { color: var(--accent-ink); }
.header-actions { display: flex; align-items: center; gap: 7px; min-width: 0; }
.userchip {
  max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: .78rem; font-weight: 700; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 72%, transparent);
  border: 1px solid var(--line); padding: 7px 10px; border-radius: 999px;
}
.icon-btn {
  width: 38px; height: 38px; flex: 0 0 auto; border-radius: 12px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 82%, transparent);
  display: grid; place-items: center; font-size: .74rem; font-weight: 750;
  transition: .18s transform, .18s background, .18s border-color; box-shadow: var(--shadow-sm);
}
.icon-btn svg { width: 17px; height: 17px; display: block; }
.icon-btn:hover { transform: translateY(-1px); background: var(--panel-2); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs {
  position: sticky; top: 0; z-index: 30; display: flex; gap: 5px; overflow-x: auto;
  padding: 9px max(12px, calc((100vw - 1140px) / 2 + 16px));
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line); scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 42px; padding: 9px 13px; border-radius: 999px; border: 1px solid transparent;
  background: transparent; color: var(--muted); font-weight: 650; font-size: .84rem; white-space: nowrap;
  transition: transform .24s ease, background .18s ease, color .18s ease, border-color .18s ease;
}
.tab:hover, .tab:focus-visible { color: var(--text); background: var(--panel-2); transform: scale(1.08); }
.tab .tab-ico {
  display: inline-block; max-width: 2.2em; overflow: hidden; opacity: 1; line-height: 1.15;
  transition: max-width .24s ease, opacity .16s ease;
}
.tab .tab-label {
  display: inline-block; max-width: 0; overflow: hidden; opacity: 0;
  font-size: .84rem; letter-spacing: -.01em;
  transition: max-width .24s ease, opacity .18s ease;
}
.tab:hover .tab-ico, .tab:focus-visible .tab-ico { max-width: 0; opacity: 0; }
.tab:hover .tab-label, .tab:focus-visible .tab-label { max-width: 140px; opacity: 1; }
.tab.active {
  background: var(--accent); color: #fff; border-color: transparent;
  box-shadow: 0 10px 24px -14px rgba(136, 19, 55, .95);
}
.tab.active:hover, .tab.active:focus-visible { background: var(--accent); color: #fff; }
.tab .dot {
  position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 999px; background: var(--accent); color: #fff; font-size: .62rem; font-weight: 800;
  display: grid; place-items: center; border: 2px solid var(--bg);
}
.tab.active .dot { background: #fff; color: var(--accent); border-color: var(--accent); }
.main { width: 100%; max-width: 1140px; margin: 0 auto; padding: 20px 16px 42px; }
.main > * + * { margin-top: 16px; }
.foot { max-width: 1140px; margin: 0 auto; padding: 4px 16px 34px; color: var(--muted); font-size: .72rem; text-align: center; }

/* ---------- Cards, grid & headings ---------- */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow); min-width: 0;
}
.card.tight { padding: 14px; border-radius: var(--radius-sm); }
.card.flat { box-shadow: none; }
.grid { display: grid; gap: 14px; min-width: 0; }
.grid > * { min-width: 0; }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 14px; min-width: 0; }
.grid-2 > *, .grid-3 > *, .grid-4 > * { min-width: 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head .sub { color: var(--muted); font-size: .86rem; margin-top: 3px; max-width: 60ch; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h2 { display: flex; align-items: center; gap: 7px; }
.card-ico { font-size: 1.05rem; }
.divider { height: 1px; background: var(--line); margin: 14px 0; border: 0; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; font-size: .88rem; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 15px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); font-weight: 650; font-size: .87rem;
  transition: .16s transform, .16s box-shadow, .16s background; text-decoration: none;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 10px 24px -14px rgba(136, 19, 55, .95); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 90%, var(--bg)); box-shadow: 0 14px 26px -14px rgba(136, 19, 55, .95); }
.btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: transparent; }
.btn-sm { padding: 7px 11px; font-size: .78rem; border-radius: 10px; }
.btn-xs { padding: 5px 8px; font-size: .72rem; border-radius: 8px; }
.btn-icon { padding: 6px 8px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Pills, badges, alerts ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  font-size: .73rem; font-weight: 700; white-space: nowrap;
}
.pill.accent { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.pill.good { background: color-mix(in srgb, var(--good) 12%, var(--panel)); color: var(--good); border-color: transparent; }
.pill.warn { background: color-mix(in srgb, var(--warn) 12%, var(--panel)); color: var(--warn); border-color: transparent; }
.pill.bad { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); color: var(--bad); border-color: transparent; }
.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; font-size: .68rem; font-weight: 750; background: var(--panel-2); color: var(--muted); }
.badge.good { background: color-mix(in srgb, var(--good) 12%, var(--panel)); color: var(--good); }
.badge.warn { background: color-mix(in srgb, var(--warn) 12%, var(--panel)); color: var(--warn); }
.badge.bad { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); color: var(--bad); }
.alert {
  border: 1px solid var(--line); border-left: 4px solid var(--accent);
  background: var(--panel); border-radius: var(--radius-sm); padding: 13px 14px;
}
.alert + .alert { margin-top: 9px; }
.alert.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); }
.alert.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
.alert.good { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--panel)); }
.alert.info { border-left-color: var(--accent); }
.alert-title { display: flex; align-items: center; gap: 7px; font-weight: 750; font-size: .9rem; }
.alert p { color: var(--muted); font-size: .82rem; margin-top: 4px; }
.alert-fix { margin-top: 8px; font-size: .8rem; font-weight: 600; color: var(--text); background: var(--panel-2); border-radius: 9px; padding: 7px 9px; }
.alert-fix b { color: var(--accent-ink); }
.alert-stack .alert { margin-top: 0; }
.warning-banner { border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--line)); background: color-mix(in srgb, var(--bad) 15%, var(--panel)); color: var(--text); border-radius: var(--radius-sm); padding: 12px 14px; font-size: .84rem; }
.warning-banner strong { color: var(--bad); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field-label { font-size: .76rem; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="number"], input[type="password"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; padding: 10px 11px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); outline: none; transition: .15s border, .15s box-shadow;
  font-size: .88rem; min-height: 42px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 18px, calc(100% - 11px) 18px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.form-grid { display: grid; gap: 12px; }
.form-error { color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, var(--panel-2)); border-radius: 9px; padding: 8px 10px; font-size: .8rem; font-weight: 600; }
.field-error { display: block; color: var(--bad); font-size: .75rem; font-weight: 600; margin-top: 5px; }
.form-note { color: var(--muted); font-size: .74rem; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 7px; }
.check {
  display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel-2); font-size: .8rem; cursor: pointer; user-select: none;
}
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.segmented { display: flex; gap: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.segmented button { flex: 1; padding: 8px 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; font-size: .82rem; }
.segmented button.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow-sm); }
.trainer-switch { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.trainer-switch .segmented { width: 100%; max-width: 460px; }
.trainer-switch .segmented button { white-space: nowrap; }
.filter-bar { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 12px; }
.filter-bar .field > label { font-size: .7rem; }
.filter-summary { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.recipe-meta { font-size: .72rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 3px; }
.recipe-meta span { display: inline-flex; align-items: center; gap: 4px; }
.recipe-serving { font-size: .68rem; color: var(--muted); }
.mode-note { font-size: .78rem; color: var(--muted); margin-top: 8px; max-width: 68ch; }

/* ---------- Dashboard ---------- */
.hero { position: relative; overflow: hidden; }
.hero::after {
  content: ""; position: absolute; right: -70px; top: -90px; width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 20%, transparent), transparent 65%);
  pointer-events: none;
}
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.hero-greeting { font-size: .78rem; font-weight: 750; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .09em; }
.hero h1 { margin-top: 5px; }
.hero-sub { color: var(--muted); font-size: .86rem; margin-top: 6px; max-width: 52ch; }
.hero-progress { margin-top: 24px; }
.progress-label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: .77rem; font-weight: 650; color: var(--muted); margin-bottom: 6px; }
.progress-label strong { color: var(--text); font-size: .9rem; }
.progress { height: 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent)); transition: width .5s ease; }
.progress.good > span { background: linear-gradient(90deg, var(--accent), var(--accent)); }
.progress.warn > span { background: linear-gradient(90deg, var(--accent), var(--accent)); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow-sm); min-width: 0; }
.stat-value { font-size: 1.22rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.stat-value small { font-size: .65em; font-weight: 650; color: var(--muted); margin-left: 2px; }
.stat-label { font-size: .69rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
.stat-sub { font-size: .7rem; color: var(--muted); margin-top: 4px; }
.today-plan-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.today-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: .85rem; }
.today-row:last-child { border-bottom: 0; }
.today-row .muted { font-size: .74rem; }
/* ---------- Onboarding & auth ---------- */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 22px 16px 40px; }
.auth-shell { width: 100%; max-width: 1060px; display: grid; gap: 22px; align-items: center; }
.auth-hero { padding: 8px 4px; }
.auth-hero h1 { margin-top: 20px; font-size: clamp(2rem, 5.2vw, 3.25rem); line-height: 1.04; letter-spacing: -.045em; }
.auth-hero h1 span { color: var(--accent-ink); }
.auth-hero p { color: var(--muted); font-size: .9rem; max-width: 52ch; margin-top: 12px; }
.auth-features { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
.auth-list { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 9px; }
.auth-list li { display: flex; gap: 9px; font-size: .82rem; color: var(--muted); align-items: flex-start; }
.auth-list li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; margin-top: 7px; }
.auth-card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: var(--shadow); }
.auth-card h2 { margin-bottom: 4px; }
.auth-switch { margin: 15px 0 16px; }
.auth-demo { margin-top: 14px; padding: 11px 12px; border-radius: 12px; background: var(--panel-2); border: 1px dashed var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.auth-demo p { font-size: .74rem; color: var(--muted); }
.auth-demo b { color: var(--text); }
.onboard-wrap { width: 100%; max-width: 880px; margin: 0 auto; padding: 22px 16px 42px; }
.onboard { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: var(--shadow); }
.onboard-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
.form-grid { display: grid; gap: 12px; }
.form-grid .span-2 { min-width: 0; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 7px; }

/* ---------- Trainer ---------- */
.day-card { display: flex; flex-direction: column; gap: 10px; }
.day-card > .btn { margin-top: auto; align-self: flex-start; }
.day-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.day-weekday { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); }

function playClickSound() {
  if (!toneContext) return;
  const now = toneContext.currentTime;
  const osc = toneContext.createOscillator();
  const gain = toneContext.createGain();
  // Pleasant "ding" sound: triangle wave, starts high, slides down quickly
  osc.type = 'triangle';
  osc.frequency.value = 1200;
  osc.connect(gain);
  gain.connect(toneContext.destination);
  // Quick exponential fade-out in 80ms
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  osc.start(now);
  osc.stop(now + 0.1);
}

// <logic:end>
// <logic:start>
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({

  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');

  return `${y}-${m}-${d}`;
}

  const date = parseDate(value);

  return isoDate(date);
}

// <logic:start>

// <logic:end>

// Case-insensitive substring filter over the built-in and custom food lists.
// An empty or blank query returns both lists unchanged.
function filterFoodItems(query, dbFoods, customFoods) {
  const q = String(query || '').trim().toLowerCase();
  const matches = name => !q || String(name || '').toLowerCase().includes(q);
  return {
    builtIn: (Array.isArray(dbFoods) ? dbFoods : []).filter(food => food && matches(food.name)),
    custom: (Array.isArray(customFoods) ? customFoods : []).filter(food => food && matches(food.name))
  };
}

/* ---------------------------------------------------------------------------
   Recipe compatibility helpers
   --------------------------------------------------------------------------- */
const ALLERGEN_WORDS = {
  dairy: ['dairy', 'milk', 'lactose', 'yogurt', 'yoghurt', 'cheese', 'butter', 'cream', 'paneer', 'ricotta', 'mozzarella', 'halloumi'],
  eggs: ['egg', 'omelette', 'frittata'],
  nuts: ['nut', 'almond', 'cashew', 'walnut', 'pistachio', 'hazelnut'],
  peanuts: ['peanut'],
  gluten: ['gluten', 'wheat', 'bread', 'pasta', 'flour', 'oats', 'pita', 'wrap', 'tortilla', 'noodle', 'bulgur', 'couscous'],
  soy: ['soy', 'tofu', 'edamame', 'miso', 'tempeh'],
  fish: ['fish', 'salmon', 'tuna', 'cod', 'sardine', 'anchovy', 'fish sauce'],
  shellfish: ['shellfish', 'shrimp', 'prawn', 'crab', 'lobster'],
  sesame: ['sesame', 'tahini']
};

// Accept the stored diet keys as well as friendly text ("Vegetarian", "Veg",
// "eggitarian" and so on) so profile edits never break recipe filtering.
function normalizeDiet(value) {
  const text = String(value || '').toLowerCase().trim();
  if (DIET_LABELS[text]) return text;
  if (text.includes('vegan')) return 'vegan';
  if (text.includes('egg')) return 'eggetarian';
  if (text.includes('veg')) return 'vegetarian';
  return 'nonveg';
}

// Recipes tag every diet they are compatible with. A non-vegetarian eater can
// eat anything; stricter diets only see recipes tagged for that diet.
function fitsDiet(recipe, diet) {
  const key = normalizeDiet(diet);
  if (key === 'nonveg') return true;
  return (recipe.diets || []).includes(key);
}

// Remove recipes that contain an allergen named by the user. This is a
// best-effort text match, not a medical allergy guarantee.
function allergenFree(recipe, allergies) {
  const text = String(allergies || '').toLowerCase().trim();
  if (!text) return true;

  const ignored = new Set(['none', 'no', 'nil', 'nothing', 'na', 'n/a']);
  const tokens = text
    .split(/[,;/|]+|\band\b/)
    .map(token => token.trim())
    .filter(token => token.length > 2 && !ignored.has(token));
  if (!tokens.length) return true;

  const categories = new Set();
  Object.entries(ALLERGEN_WORDS).forEach(([category, words]) => {
    if (words.some(word => text.includes(word))) categories.add(category);
  });

  const listed = recipe.allergens || [];
  if (listed.some(allergen => categories.has(allergen))) return false;

  const ingredientText = (recipe.ingredients || [])
    .map(item => String(item.name || '').toLowerCase())
    .join(' ');
  return !tokens.some(token => ingredientText.includes(token));
}

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return { profiles: {}, schemaVersion: 0 };
    let parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return { profiles: {}, schemaVersion: 0 };
    if (parsed.schemaVersion === undefined) parsed.schemaVersion = 0;
    if (!Number.isInteger(parsed.schemaVersion) || parsed.schemaVersion < 0 || parsed.schemaVersion > SCHEMA_VERSION) {
      throw new Error('Unsupported Trainer4U schema version.');
    }
    if (parsed.schemaVersion < SCHEMA_VERSION) parsed = migrateDB(parsed);
    if (!parsed.profiles || typeof parsed.profiles !== 'object' || Array.isArray(parsed.profiles)) parsed.profiles = {};
    return parsed;
  } catch (err) {
    console.warn('Trainer4U could not load saved profiles:', err);
    return { profiles: {}, schemaVersion: 0 };
  }
}

function migrateDB(parsed) {
  // Schema v0 → v1: ensure profile fields exist for all users
  // This is a no-op for v1 → v2 since we've been using v2 key, but keep for future use
  if (parsed.schemaVersion < 1) {
    // Ensure all profiles have the expected structure
    const defaults = {
      name: '', age: null, sex: '', height: null, weight: null,
      targetWeight: null, startWeight: null, activity: '', goal: '',
      diet: '', allergies: '', injuries: '', equipment: ['bodyweight'],
      daysPerWeek: null, experience: 'beginner'
    };
    // Migrate existing profiles
    if (parsed.profiles) {
      Object.values(parsed.profiles).forEach(user => {
        user.profile = { ...defaults, ...user.profile };
      });
    }
    parsed.schemaVersion = 1;
  }
  // Schema v1 → v2: add schemaVersion field if missing
  if (parsed.schemaVersion < 2) {
    // No structural changes v1→v2 yet, just ensure version is set
    parsed.schemaVersion = 2;
  }
  return parsed;
}

// <logic:end>

function saveDB() {
  // Embed schema version so future migrations can detect old data
  state.db.schemaVersion = SCHEMA_VERSION;
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(state.db));
  } catch (err) {
    toast('Could not save to this browser. Storage may be full.');

}

function saveUser() {
  if (!state.user) return;

function randomSalt() {
  if (!window.crypto || !window.crypto.getRandomValues) {
    throw new Error('Secure account creation requires HTTPS or localhost.');
  }
  const bytes = window.crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
}

async function hashPassword(password, salt) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error('Secure password hashing requires HTTPS or localhost.');
  }
  const bytes = new TextEncoder().encode(`${salt}:${password}`);
  const digest = await window.crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
}

// Encrypted backups: PBKDF2 (250k rounds, SHA-256) + AES-256-GCM.
// The password never leaves the browser and is never stored.
const BACKUP_KDF_ITERATIONS = 250000;
function bytesToHex(bytes) { return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join(''); }
function hexToBytes(hex) { return new Uint8Array(String(hex).match(/.{2}/g).map(pair => parseInt(pair, 16))); }
async function backupKeyFromPassword(password, saltHex) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error('Encrypted backups require HTTPS or localhost.');
  }
  const baseKey = await window.crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return window.crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: hexToBytes(saltHex), iterations: BACKUP_KDF_ITERATIONS },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function encryptBackupText(plaintext, password) {
  const salt = randomSalt();
  const iv = bytesToHex(window.crypto.getRandomValues(new Uint8Array(12)));
  const key = await backupKeyFromPassword(password, salt);
  const cipherBuffer = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv: hexToBytes(iv) }, key, new TextEncoder().encode(plaintext));
  return {
    app: 'Trainer4U', encrypted: true, version: 1,
    kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: BACKUP_KDF_ITERATIONS, salt },
    cipher: { name: 'AES-GCM', iv },
    data: bytesToHex(new Uint8Array(cipherBuffer))
  };
}
async function decryptBackupEnvelope(envelope, password) {
  const key = await backupKeyFromPassword(password, envelope.kdf.salt);
  const plainBuffer = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: hexToBytes(envelope.cipher.iv) }, key, hexToBytes(envelope.data));
  return new TextDecoder().decode(plainBuffer);
}

function validateCustomFood(fields) {
  const errors = [];
  const name = String(fields.name || '').trim();
  const servingLabel = String(fields.servingLabel || '').trim();
  const numeric = (value, label, min, max) => {
    const raw = value == null ? '' : String(value).trim();
    const parsed = raw === '' ? NaN : Number(raw);
    if (!Number.isFinite(parsed) || parsed < min || parsed > max) errors.push([label, `${label} must be between ${min} and ${max}.`]);
    return parsed;
  };
  if (!name || name.length > 120) errors.push(['name', 'Food name is required and must be at most 120 characters.']);
  if (!servingLabel || servingLabel.length > 40) errors.push(['servingLabel', 'Serving name is required and must be at most 40 characters.']);
  const servingGrams = numeric(fields.servingGrams, 'servingGrams', 1, 2000);
  const calories = numeric(fields.calories, 'calories', 0, 5000);
  const protein = numeric(fields.protein, 'protein', 0, 1000);
  const carbs = numeric(fields.carbs, 'carbs', 0, 1000);
  const fat = numeric(fields.fat, 'fat', 0, 1000);
  return { errors, values: { name, servingLabel, servingGrams, calories, protein, carbs, fat } };
}

function gramsForPortion(amount, unit, food) {
  const value = Number(amount);
  if (!Number.isFinite(value) || value <= 0) return NaN;
  if (unit === 'grams') return value;
  if (unit === '100g') return value * 100;
  if (unit === 'oz') return value * 28.349523125;
  if (unit === 'serving' && food && Number(food.servingGrams) > 0) return value * Number(food.servingGrams);
  return NaN;
}

function foodEntryFromFood(date, meal, food, grams, portion = '') {
  const savedGrams = round(Number(grams), 1);
  const custom = food && Number(food.servingGrams) > 0;
  const basis = custom ? Number(food.servingGrams) : 100;
  const factor = savedGrams / basis;
  const calories = custom ? Number(food.calories) : Number(food.cal);
  const protein = Number(food.protein);
  const carbs = Number(food.carbs);
  const fat = Number(food.fat);
  return {
    id: uid(),
    date,
    meal,
    name: food.name,
    grams: savedGrams,
    portion,
    calories: round(calories * factor, 0),
    protein: round(protein * factor, 1),
    carbs: round(carbs * factor, 1),
    fat: round(fat * factor, 1)
  };
}
// <logic:end>

function sampleFoodEntry(date, meal, name, grams) {
  const food = FOOD_DB.find(item => item.name === name) || { cal: 0, protein: 0, carbs: 0, fat: 0 };
  return foodEntryFromFood(date, meal, food, grams);
}

// <logic:start>
function weightTrendPerWeek(weights, nowMs) {
  const sorted = weights.filter(w => w && w.date && Number.isFinite(Number(w.kg)))
    .slice().sort((a,b)=>a.date.localeCompare(b.date));
  if (sorted.length < 2) return null;
  const first = sorted[0], last = sorted[sorted.length-1];
  let spanDays = Math.round((new Date(last.date) - new Date(first.date)) / 86400000);
  if (!Number.isFinite(spanDays) || spanDays < 7) return null;
  const perWeek = ((Number(last.kg) - Number(first.kg)) / spanDays) * 7;
  return { perWeek: Number(perWeek.toFixed(2)), spanDays };
}
function weightTrendCategory(goal, perWeek) {
  if (perWeek == null) return 'no-data';
  const wrongWay = (goal === 'lose' && perWeek > 0.25) || ((goal === 'gain' || goal === 'build') && perWeek < -0.25);
  return wrongWay ? 'wrong-way' : 'on-track';
}
function calorieDrift(foodDays, targetCalories, goal) {
  if (!foodDays || foodDays.length < 3) return null;
  const avg = foodDays.reduce((s,d)=>s+Number(d.calories||0),0)/foodDays.length;
  let adjustment = 0;
  if (goal === 'lose' && avg > targetCalories + 250) adjustment = -100;
  else if (avg < targetCalories - 350) adjustment = 150;
  return { avg: Math.round(avg), adjustment };
}
function proteinGap(foodDays, targetProtein) {
  if (!foodDays || foodDays.length < 3) return null;
  const avg = foodDays.reduce((s,d)=>s+Number(d.protein||0),0)/foodDays.length;
  return { avg: Math.round(avg), gap: avg < targetProtein*0.7 ? 10 : 0 };
}
function sleepDeficit(entries) {
  if (!entries || !entries.length) return null;
  const avg = entries.reduce((s,e)=>s+Number(e.hours||0),0)/entries.length;
  return { avg: Number(avg.toFixed(1)), deficit: avg < 6.5 };
}
// <logic:end>
// <logic:start>
function totalsForEntries(entries) {
  return entries.reduce((sum, entry) => {
    sum.calories += Number(entry.calories) || 0;
    sum.protein += Number(entry.protein) || 0;
    sum.carbs += Number(entry.carbs) || 0;
    sum.fat += Number(entry.fat) || 0;
    return sum;
  }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
}
// <logic:end>

function getCaloriesForDate(user, date) {
  return totalsForEntries(user.logs.food.filter(entry => entry.date === date));
}

// <logic:start>
function sortedWeights(user) {
  return [...user.logs.weights]
    .filter(entry => entry && entry.date)
    .sort((a, b) => a.date.localeCompare(b.date));
}
// <logic:end>

// <logic:start>
function currentWeight(user) {
  const weights = sortedWeights(user);
  if (weights.length) return Number(weights[weights.length - 1].kg) || 0;
  return Number(user.profile.weight) || 0;
}
// <logic:end>

// <logic:start>
function weightProgress(user) {
  const weights = sortedWeights(user);
  const start = Number(user.profile.startWeight) || (weights[0] && Number(weights[0].kg)) || currentWeight(user);
  const current = currentWeight(user) || start;
  const target = Number(user.profile.targetWeight) || null;
  const change = round(current - start, 1);
  const total = target ? Math.abs(target - start) : 0;
  const direction = target > start ? 1 : target < start ? -1 : 0;
  const done = direction ? Math.max(0, direction * (current - start)) : 0;
  const pct = target && total > 0 ? clamp((done / total) * 100, 0, 100) : 0;
  return {
    start: round(start, 1),
    current: round(current, 1),
    target,
    change,
    toGo: target ? round(Math.abs(target - current), 1) : null,
    pct: Math.round(pct)
  };
}
// <logic:end>

function loggingStreak(user) {
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const date = dateOffset(-i);
    const hasLog = user.logs.food.some(entry => entry.date === date) ||
      user.logs.weights.some(entry => entry.date === date) ||
      user.logs.workouts.some(entry => entry.date === date) ||
      user.logs.sleep.some(entry => entry.date === date);
    if (hasLog) streak += 1;
    else if (i === 0) continue;
    else break;
  }
  return streak;
}

function bmiCategory(bmi) {

  if (bmi < 25) return { label: 'Healthy range', cls: 'good' };

function userUnits(user) {

function kgToLb(kg) { return kg / KG_PER_LB; }
function lbToKg(lb) { return lb * KG_PER_LB; }
function cmToIn(cm) { return cm / CM_PER_IN; }

function lengthUnit(units) { return units === 'imperial' ? 'in' : 'cm'; }
function displayWeight(kg, units) {
  if (kg === null || kg === undefined || kg === '') return null;
  const n = Number(kg);
  if (!Number.isFinite(n)) return null;
  return units === 'imperial' ? round(kgToLb(n), 1) : round(n, 1);
}
function displayLength(cm, units) {
  if (cm === null || cm === undefined || cm === '') return null;
  const n = Number(cm);
  if (!Number.isFinite(n)) return null;
  return units === 'imperial' ? round(cmToIn(n), 1) : round(n, 1);
}
function parseWeightInput(value, units) {
  const n = Number(value);
  if (!Number.isFinite(n)) return NaN;
  return units === 'imperial' ? round(lbToKg(n), 2) : n;
}
function parseLengthInput(value, units) {

  if (!Number.isFinite(n)) return NaN;

// <logic:end>

// <logic:start>
// Explains, in plain language built from the real plan data, why the current
// week is scheduled the way it is. Shown as the Why this week card in Trainer.
function planRationale(plan, user) {
  const p = (user && user.profile) || {};
  const reasons = [];
  const requested = clamp(Number(p.daysPerWeek) || 3, 1, 7);
  const dayWord = n => `${n} day${n === 1 ? '' : 's'}`;
  if (plan.adjustments && plan.adjustments.days) {
    reasons.push(`You asked for ${dayWord(requested)} per week, but recent missed sessions trimmed this week to ${dayWord(plan.days)}. Log your sessions and the full schedule comes back on its own.`);
  } else {
    reasons.push(`You train ${dayWord(plan.days)} per week because that is the time you said you can commit to, and it drives the whole layout.`);
  }
  const sessions = plan.schedule.filter(day => !day.rest && !day.recovery);
  const labels = sessions.map(day => day.label);
  const focuses = [...new Set(sessions.map(day => day.focus))];
  if (plan.trainingDays <= 2) {
    reasons.push(`With only ${dayWord(plan.trainingDays)} of training, ${focuses.length === 1 ? 'every session is full body' : 'the sessions between them cover the whole body'}, so no muscle group waits a week between workouts.`);
  } else if (plan.trainingDays === 3) {
    reasons.push(`Three sessions split into ${labels.join(', ')}, so each movement pattern is trained hard once a week with a full week to recover.`);
  } else {
    reasons.push(`${dayWord(plan.trainingDays)} of training split into ${labels.join(', ')}, so each area gets worked more than once a week without any session running too long.`);
  }
  if (plan.schedule.some(day => day.rest)) {
    reasons.push('Rest days sit between the harder sessions where possible, because muscle is built during recovery, not during the workout itself.');
  }
  const modeText = plan.mode === 'gym' ? 'a standard gym floor' : `bodyweight movements${(p.equipment || []).some(item => ['dumbbells', 'bands', 'kettlebell'].includes(item)) ? ' plus your home kit' : ''}`;
  reasons.push(`Exercises are chosen for your ${(GOAL_LABELS[p.goal] || 'maintain').toLowerCase()} goal, ${p.experience || 'beginner'} experience and ${modeText}${p.injuries ? ', filtering out movements that commonly aggravate the area you noted' : ''}.`);
  reasons.push('Progression is built in: when you reach the top of a rep range with good form, the plan nudges you to add a little weight or a harder variation next time.');
  return reasons;
}
// <logic:end>
function hydrationTarget(user) {
  const weight = currentWeight(user) || Number(user.profile.weight) || 70;
  return Math.round(clamp((weight * 35) / 250, 6, 16));
}
function targetWarnings(user) {
  const warnings = [];
  const p = user.profile;
  const weight = currentWeight(user);
  const target = Number(p.targetWeight) || 0;
  if (target && weight && Math.abs(target - weight) > weight * 0.25) {
    warnings.push('Your target weight is more than 25% away from your current weight. A very large change is best planned with a doctor or registered dietitian.');
  }
  if (target && p.height) {
    const targetBmi = target / ((Number(p.height) / 100) ** 2);
    if (targetBmi < 17.5) warnings.push('Your target weight corresponds to a BMI below 17.5, which is not a safe long-term goal for most people.');
  }
  const t = targets(user);
  if (t.unsafe) warnings.push('Your calculated calorie target was raised to a conservative safety floor. Do not cut further without professional supervision.');
  if (p.age && Number(p.age) < 18) warnings.push('Trainer4U is designed for adults. Teenagers should follow guidance from a paediatrician or qualified coach.');
  return warnings;
}

// <logic:start>
function macroTargets(calories, weight, goal, proteinAdjustment = 0) {
  const proteinPerKg = goal === 'lose' || goal === 'build' ? 2 : goal === 'gain' ? 1.8 : 1.6;
  let protein = Math.round(clamp(weight * proteinPerKg + proteinAdjustment, 60, 260));
  let fat = Math.round(clamp((calories * 0.27) / 9, 35, 130));
  let remaining = calories - protein * 4 - fat * 9;

  // Preserve the 50 g carbohydrate floor by reducing fat, then protein,
  // rather than displaying macros whose calories exceed the calorie target.
  if (remaining < 200) {
    const needed = 200 - remaining;
    const fatCut = Math.min(fat - 35, Math.ceil(needed / 9));
    fat -= fatCut;
    remaining += fatCut * 9;
  }
  if (remaining < 200) {
    const needed = 200 - remaining;
    const proteinCut = Math.min(protein - 60, Math.ceil(needed / 4));
    protein -= proteinCut;
    remaining += proteinCut * 4;
  }
  let carbs = Math.max(50, Math.round(remaining / 4));
  if (protein * 4 + fat * 9 + carbs * 4 > calories) {
    carbs = Math.max(50, Math.floor(remaining / 4));
  }
  const excess = protein * 4 + fat * 9 + carbs * 4 - calories;
  if (excess > 0 && protein > 60) protein -= Math.min(protein - 60, Math.ceil(excess / 4));
  return { protein, fat, carbs };
}
// <logic:end>

// <logic:start>
/**
 * Calculate Basal Metabolic Rate (Mifflin-St Jeor) and Total Daily Energy Expenditure.
 * @param {object} user - User state object with profile data
 * @returns {object} BMR, TDEE, and derived targets (calories, protein, carbs, fat)
 *
 * BMR formula (Mifflin-St Jeor):
 *   Male:   10 × weight(kg) + 6.25 × height(cm) − 5 × age(y) + 5
 * Female: 10 × weight(kg) + 6.25 × height(cm) − 5 × age(y) − 161
 *
 * TDEE = BMR × activity multiplier
 *   Sedentary: 1.2 | Light: 1.375 | Moderate: 1.55 | Active: 1.725 | Very active: 1.9
 *
 * Macro splits (after TDEE):
 *   Calorie delta: lose −500, gain +400, build +250, maintain 0
 *   Protein:     lose/maintain 1.6g/kg, build 1.8g/kg, lose/build 2.0g/kg
 *   Fat:         27% of calories ÷ 9 kcal/g, clamped to [35, 130]g
 *   Carbs:       (calories − protein×4 − fat×9) ÷ 4, minimum 50g
 *
 * A calorie target below safeMin is flagged as `unsafe` and raised to the safety floor.
 */
function baseTargets(user) {
  const p = user.profile || {};
  const weight = currentWeight(user) || Number(p.weight) || 70;
  const height = Number(p.height) || 170;
  const age = Number(p.age) || 30;
  const sexAdjust = p.sex === 'male' ? 5 : p.sex === 'female' ? -161 : -78;
  /**
   * Mifflin-St Jeor BMR formula:
   *   Male:   10 × weight(kg) + 6.25 × height(cm) − 5 × age(y) + 5
   * Female: 10 × weight(kg) + 6.25 × height(cm) − 5 × age(y) − 161
   */
  const bmr = 10 * weight + 6.25 * height - 5 * age + sexAdjust;
  const tdee = bmr * (ACTIVITY_MULTIPLIERS[p.activity] || 1.55);
  const goalDelta = p.goal === 'lose' ? -500 : p.goal === 'gain' ? 400 : p.goal === 'build' ? 250 : 0;
  const safeMin = p.sex === 'female' ? 1200 : p.sex === 'male' ? 1500 : 1350;
  const rawCalories = tdee + goalDelta;
  const unsafe = rawCalories < safeMin;
  const calories = Math.round(clamp(rawCalories, safeMin, 5000) / 10) * 10;
  const { protein, fat, carbs } = macroTargets(calories, weight, p.goal);
  return {
    bmr: Math.round(bmr),
    tdee: Math.round(tdee),
    calories,
    protein,
    carbs,
    fat,
    safeMin,
    unsafe,
    goalDelta
  };
}
// <logic:end>

// <logic:start>
/**
 * Run the course-correction engine on user data.
 * Inspects workout consistency, calorie drift, protein intake, sleep, and weight trend.
 * Produces a set of alerts with specific fixes, and automatic adjustments to
 * the weekly plan and daily calorie/macro targets.
 *
 * Inputs (from user state):
 *   - profile: age, sex, height, weight, goal, diet, allergies, injuries
 *   - logs: workouts, food entries (with dates), weights, measurements, sleep, hydration, symptoms
 *   - settings: theme, trainerMode
 *
 * Outputs:
 *   - alerts: array of { level, title, body, fix } objects
 *   - adjustments: { days, sets, calorie, protein } to apply to plan/targets
 *
 * Alert levels: 'good' (positive reinforcement), 'info' (gentle nudge),
 *   'warn' (attention needed), 'bad' (serious concern)
 */
function getInsights(user) {
  const p = user.profile || {};
  const base = baseTargets(user);
  const alerts = [];
  const adjustments = { days: 0, sets: 0, calorie: 0, protein: 0 };
  const planned = clamp(Number(p.daysPerWeek) || 3, 1, 7);
  const trainedDays = new Set(workoutsLast7(user).map(workout => workout.date)).size;
  const missed = Math.max(0, planned - trainedDays);

  if (user.logs.workouts.length) {
    if (missed >= 3) {
      adjustments.days = missed >= 5 ? -2 : -1;
      adjustments.sets = -1;
      alerts.push({
        level: 'warn',
        title: `You missed ${missed} planned workouts this week`,
        body: `You trained ${trainedDays} of ${planned} planned days. Life happens — consistency matters more than perfection, and a 15-minute session still counts.`,
        fix: `Your plan is automatically reduced to ${Math.max(1, planned + adjustments.days)} days this week. Put the session in your calendar and treat it like an appointment.`
      });
    } else if (missed === 2) {
      alerts.push({
        level: 'info',
        title: 'Two sessions slipped this week',
        body: 'You are close to your target, so one strong session can put you back on track.',
        fix: 'Schedule a 20-minute full-body session in the next 48 hours and keep the warm-up short.'
      });
    } else if (trainedDays >= planned) {
      alerts.push({
        level: 'good',
        title: 'You hit your training target',
        body: `${trainedDays} sessions logged against ${planned} planned days. That consistency is what drives progress.`,
        fix: 'Keep the same schedule next week and add a small amount of load or one extra rep where form stays clean.'
      });
    }
  }

  // Completed days only: today is usually a partial food log and would make
  // the weekly average (and any alert based on it) misleading.
  const foodDays = loggedDays(user, 7).filter(day => day.date !== today());
  if (foodDays.length >= 3) {
    const avgCalories = foodDays.reduce((sum, day) => sum + day.calories, 0) / foodDays.length;
    const avgProtein = foodDays.reduce((sum, day) => sum + day.protein, 0) / foodDays.length;
    if (p.goal === 'lose' && avgCalories > base.calories + 250) {
      adjustments.calorie = -100;
      alerts.push({
        level: 'warn',
        title: 'Calories are running above target',
        body: `Your logged average is ${Math.round(avgCalories)} kcal against a ${base.calories} kcal target. A small daily gap adds up over a week.`,
        fix: 'Tighten portion sizes at one meal rather than skipping meals. Your target has been nudged down by 100 kcal this week.'
      });
    } else if (avgCalories < base.calories - 350) {
      adjustments.calorie = 150;
      alerts.push({
        level: 'warn',
        title: 'You are eating well below target',
        body: `Your logged average is ${Math.round(avgCalories)} kcal against a ${base.calories} kcal target. Under-fuelling can hurt recovery and muscle retention.`,
        fix: 'Add a protein-rich snack such as yogurt, eggs or a shake. Your target has been raised by 150 kcal this week.'
      });
    }
    if (avgProtein < base.protein * 0.7) {
      adjustments.protein = 10;
      alerts.push({
        level: 'info',
        title: 'Protein is below your target',
        body: `You are averaging ${Math.round(avgProtein)} g protein against a ${base.protein} g target. Protein protects muscle and keeps you full.`,
        fix: 'Anchor each meal with a palm-sized portion of protein. The daily target has been raised slightly for the next week.'
      });
    }
    if (p.goal === 'lose' && avgCalories <= base.calories + 150 && avgProtein >= base.protein * 0.9) {
      alerts.push({
        level: 'good',
        title: 'Nutrition is matching the plan',
        body: 'Your recent calories and protein are close to target on the days you logged.',
        fix: 'Keep logging the same way and review the weekly average rather than a single day.'
      });
    }
  }

  const recentWeights = sortedWeights(user).filter(entry => entry.date >= dateOffset(-28));
  if (recentWeights.length >= 2) {
    const first = recentWeights[0];
    const last = recentWeights[recentWeights.length - 1];
    const spanDays = Math.round((new Date(last.date) - new Date(first.date)) / 86400000);
    if (spanDays >= 7) {
      const perWeek = ((Number(last.kg) - Number(first.kg)) / spanDays) * 7;
      const wrongWay = (p.goal === 'lose' && perWeek > 0.25) ||
        ((p.goal === 'gain' || p.goal === 'build') && perWeek < -0.25);
      if (wrongWay) {
        alerts.push({
          level: 'warn',
          title: 'Weight is trending the wrong way',
          body: `Your weigh-ins are moving ${perWeek > 0 ? 'up' : 'down'} by about ${Math.abs(round(userUnits(user) === 'imperial' ? kgToLb(perWeek) : perWeek, 2))} ${weightUnit(userUnits(user))} per week over the last ${spanDays} days, while your goal is ${(GOAL_LABELS[p.goal] || 'maintain').toLowerCase()}.`,
          fix: p.goal === 'lose'
            ? 'Check portion sizes, drinks and weekend meals before cutting calories further. Keep protein high and review the trend over two weeks, not one weigh-in.'
            : 'Add one calorie-dense meal or snack (oats, nuts, yogurt, rice) and reduce optional cardio. If the trend continues, review your target with a professional.'
        });
      }
    }
  }

  const sleepAvg = sleepAverage(user);
  if (sleepAvg !== null && sleepAvg < 6.5) {
    adjustments.sets = Math.min(adjustments.sets, -1);
    alerts.push({
      level: 'warn',
      title: 'Sleep is limiting recovery',
      body: `You are averaging ${round(sleepAvg, 1)} hours. Short sleep raises perceived effort and slows recovery.`,
      fix: 'Set a consistent wake time, dim screens an hour before bed, and keep this week’s training volume slightly lower.'
    });
  }

  return { alerts, adjustments };
}
// <logic:end>

/**
 * Apply insight-based adjustments to the base targets.
 * @param {object} user - User state object with profile data
 * @returns {object} Final calorie/macro targets with adjustment flags
 *
 * Takes the base BMR/TDEE targets and applies automatic course corrections
 * from the insights engine (calorie drift, protein gaps, missed workouts,
 * sleep deficits, weight-trend warnings).
 */
function targets(user) {
  const base = baseTargets(user);
  const insights = getInsights(user);
  const adjustments = insights.adjustments;
  const calories = Math.round(clamp(base.calories + (adjustments.calorie || 0), base.safeMin, 5000) / 10) * 10;
  const { protein, fat, carbs } = macroTargets(calories, currentWeight(user) || Number(user.profile.weight) || 70, user.profile.goal, adjustments.protein || 0);
  return { ...base, calories, protein, carbs, fat, adjustments };
}

        <div class="tiny muted" style="margin-top:7px">${changeText}${wp.target ? ` Target ${displayWeight(wp.target, units)} ${weightUnit(units)}.` : ' Add a target weight in your profile to track a goal.'}</div>
      </div>
    </section>

    <div class="stats">
      <div class="stat"><div class="stat-value">${displayWeight(wp.current, units)}<small>${weightUnit(units)}</small></div><div class="stat-label">Current weight</div><div class="stat-sub">${wp.change > 0 ? '+' : ''}${wpChangeDisp} ${weightUnit(units)}</div></div>
      <div class="stat"><div class="stat-value">${wp.target ? displayWeight(wp.target, units) : '—'}<small>${weightUnit(units)}</small></div><div class="stat-label">Target weight</div><div class="stat-sub">${wp.target ? `${displayWeight(wp.toGo, units)} ${weightUnit(units)} to go` : 'Set in profile'}</div></div>
      <div class="stat"><div class="stat-value">${Math.round(totals.calories)}<small>/${t.calories}</small></div><div class="stat-label">Calories today</div><div class="stat-sub">${Math.max(0, t.calories - Math.round(totals.calories))} kcal left</div></div>
      <div class="stat"><div class="stat-value">${Math.round(totals.protein)}<small>/${t.protein} g</small></div><div class="stat-label">Protein today</div><div class="stat-sub">${t.fat} g fat target</div></div>
      <div class="stat"><div class="stat-value">${weekWorkouts}<small>/${p.daysPerWeek}</small></div><div class="stat-label">Workouts this week</div><div class="stat-sub">${plan.days} scheduled after coaching</div></div>
      <div class="stat"><div class="stat-value">${sleep === null ? '—' : round(sleep, 1)}<small>h</small></div><div class="stat-label">Sleep average</div><div class="stat-sub">${streak} day logging streak</div></div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-head">
          <h2>Today's plan</h2>
          <span class="pill">${WEEKDAY_NAMES[weekday]}</span>
        </div>
        <h3 style="margin-bottom:2px">${esc(todayPlan.label)} ${todayPlan.recovery ? '<span class="badge">Active recovery</span>' : ''}</h3>
        <div class="tiny muted">${esc(todayPlan.focus)} · ${todayPlan.exercises.length} exercises</div>
        ${todayPlan.rest ? `
          <p class="small muted" style="margin-top:12px">Rest is part of the plan. Walk, stretch, meal-prep or simply recover — your next session will be there tomorrow.</p>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-sm" data-action="goto-tab" data-tab="trainer">See the week</button>
          </div>` : `
          <div class="today-plan-list">
            ${todayPlan.exercises.slice(0, 5).map(exercise => `
              <div class="today-row">
                <span>${esc(exercise.name)}</span>
                <span class="muted">${exercise.sets} × ${exercise.reps}</span>
              </div>`).join('')}
          </div>
          ${todayPlan.finisher ? `<div class="tiny muted" style="margin-top:9px">Finisher: ${esc(todayPlan.finisher)}</div>` : ''}
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-sm btn-primary" data-action="log-workout" data-day="${weekday}">${todayPlan.recovery ? 'Log recovery session' : 'Log workout'}</button>
            <button class="btn btn-sm btn-ghost" data-action="goto-tab" data-tab="trainer">Open trainer</button>
          </div>`}
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Coach's notes</h2>
          <span class="pill ${alertsToShow.length ? 'warn' : 'good'}">${alertsToShow.length ? `${alertsToShow.length} to review` : 'All clear'}</span>
        </div>
        <div class="alert-stack">${renderAlerts(shownAlerts, 3)}</div>
        ${insights.alerts.length > 3 ? `<p class="tiny muted" style="margin-top:9px">+ ${insights.alerts.length - 3} more note${insights.alerts.length - 3 === 1 ? '' : 's'} in the relevant sections. The plan has already adjusted.</p>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Quick actions</h2></div>
      <div class="btn-row">
        <button class="btn btn-sm" data-action="goto-tab" data-tab="nutritionist">Log food</button>
        <button class="btn btn-sm" data-action="goto-tab" data-tab="progress">Log weight</button>
        <button class="btn btn-sm" data-action="goto-tab" data-tab="chef">Find a recipe</button>
        <button class="btn btn-sm" data-action="goto-tab" data-tab="doctor">Log water</button>
      </div>
    </div>`;
}

/* Workout plan generation ------------------------------------------------ */
const WEEKDAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const WEEK_ASSIGN = {
  1: [2],
  2: [0, 3],
  3: [0, 2, 4],
  4: [0, 1, 3, 4],
  5: [0, 1, 2, 4, 5],
  6: [0, 1, 2, 3, 4, 5],
  7: [0, 1, 2, 3, 4, 5, 6]
};

// <logic:start>
// Injury-aware filtering. These are conservative movement swaps, not medical
// advice: the app removes exercises that commonly aggravate the area named.
const INJURY_RULES = [
  {
    words: ['back', 'lumbar', 'spine', 'disc', 'sciatica'],
    avoid: ['barbell deadlift', 'romanian deadlift', 'barbell row', 'kettlebell swing', 'good morning', 'bent-over']
  },
  {
    words: ['knee', 'patella', 'acl', 'meniscus'],
    avoid: ['barbell back squat', 'leg press', 'walking lunge', 'bulgarian split squat', 'reverse lunge', 'smith machine squat', 'wall sit']
  },
  {
    words: ['shoulder', 'rotator', 'deltoid'],
    avoid: ['overhead press', 'shoulder press', 'pike push-up', 'lateral raise', 'triceps dip', 'pull-up', 'chin-up', 'upright row']
  },
  {
    words: ['wrist', 'carpal'],
    avoid: ['push-up', 'incline push-up', 'bench press', 'floor press', 'plank', 'triceps dip']
  },
  {
    words: ['ankle', 'achilles', 'foot', 'plantar'],
    avoid: ['calf raise', 'walking lunge', 'reverse lunge', 'bulgarian split squat', 'step-up']
  },
  {
    words: ['elbow', 'tendinitis', 'tendonitis'],
    avoid: ['dumbbell curl', 'hammer curl', 'band curl', 'preacher curl', 'overhead triceps extension', 'triceps dip', 'skull crusher']
  },
  {
    words: ['hip', 'groin'],
    avoid: ['bulgarian split squat', 'walking lunge', 'reverse lunge', 'barbell back squat', 'leg press', 'hip abduction']
  }
];

function injuryAvoids(exercise, injuries) {
  const text = String(injuries || '').toLowerCase();
  if (!text.trim()) return false;
  const name = exercise.name.toLowerCase();
  return INJURY_RULES.some(rule =>
    rule.words.some(word => text.includes(word)) &&
    rule.avoid.some(fragment => name.includes(fragment))
  );
}

function hasEquipment(exercise, profile, mode) {
  if (mode === 'gym') return true; // the gym plan assumes a standard gym floor
  if (exercise.equip.includes('bodyweight')) return true;
  const owned = profile.equipment || [];
  return exercise.equip.some(tag =>
    (tag === 'dumbbells' || tag === 'bands' || tag === 'kettlebell') && owned.includes(tag)
  );
}

function equipmentScore(exercise, mode) {
  if (mode === 'gym') {
    if (exercise.equip.includes('gym')) return 4;
    if (exercise.equip.includes('barbell')) return 3;
    if (exercise.equip.includes('dumbbells') || exercise.equip.includes('kettlebell')) return 2;
    return 1;
  }
  if (exercise.equip.includes('bodyweight')) return 4;
  if (exercise.equip.includes('bands')) return 3;
  return 2;
}

function repRangeFor(goal) {
  if (goal === 'lose') return '12–15';
  if (goal === 'maintain') return '10–12';
  return '8–12';
}

// Isometric holds are prescribed in seconds rather than reps.
const HOLD_EXERCISES = new Set(['Plank', 'Side plank', 'Wall sit']);

/* Exercise swaps: user-chosen replacements for planned exercises. Swaps are
   stored per training mode and weekday (gym and home plans each remember
   their own choices) and key on the exercise the planner originally picked,
   so they survive plan regeneration. A stored swap that no longer fits
   (equipment changed, a new injury note, a different weekly template) is
   ignored and the original exercise shows instead. */
function swapMap(user, mode) {
  const all = user && user.planSwaps;
  if (!all || typeof all !== 'object') return {};
  const byMode = all[mode];
  return byMode && typeof byMode === 'object' ? byMode : {};
}

// Exercises that could replace `originalName` in a day: same movement slot,
// available equipment, not injury-flagged, and not already in the day.
// `otherNames` lists the day's other exercises (the swapped slot excluded).
function swapCandidates(user, mode, otherNames, originalName) {
  const original = EXERCISES.find(ex => ex.name === originalName);
  if (!original) return [];
  const taken = new Set(otherNames);
  return EXERCISES
    .filter(ex => ex.name !== originalName)
    .filter(ex => ex.slots.some(slot => original.slots.includes(slot)))
    .filter(ex => hasEquipment(ex, user.profile, mode))
    .filter(ex => !injuryAvoids(ex, user.profile.injuries))
    .filter(ex => !taken.has(ex.name))
    .map(ex => ex.name)
    .sort();
}

// Apply the user's stored swaps to a freshly built plan. Sets and rest stay
// from the original prescription; reps adapt when swapping to or from an
// isometric hold. Returns the same plan object for chaining.
function applyPlanSwaps(user, plan) {
  const reps = repRangeFor(user.profile.goal);
  plan.schedule.forEach(day => {
    if (day.rest || day.recovery) return;
    const daySwaps = swapMap(user, plan.mode)[day.weekday];
    if (!daySwaps || typeof daySwaps !== 'object') return;
    const used = new Set(day.exercises.map(ex => ex.name));
    day.exercises = day.exercises.map(pick => {
      const replacement = daySwaps[pick.name];
      if (!replacement || replacement === pick.name) return pick;
      const others = [...used].filter(name => name !== pick.name);
      if (!swapCandidates(user, plan.mode, others, pick.name).includes(replacement)) return pick;
      const ex = EXERCISES.find(item => item.name === replacement);
      used.delete(pick.name);
      used.add(ex.name);
      return {
        name: ex.name,
        sets: pick.sets,
        rest: pick.rest,
        cues: ex.cues,
        reps: HOLD_EXERCISES.has(ex.name) ? '30–45 sec' : HOLD_EXERCISES.has(pick.name) ? reps : pick.reps
      };
    });
  });
  return plan;
}
// <logic:end>

function planMode() {
  return state.trainerMode === 'home' ? 'home' : 'gym';
}

// Suggest a small weight jump when the top of the rep range is reached.
function overloadHint(user, exerciseName, reps) {
  const u = user || state.user;
  const p = u && u.profile || {};
  const goal = p.goal || 'maintain';
  const experience = p.experience || 'beginner';
  // If reps suggest we've hit the top of the range, suggest a small weight increase
  const topOfRange = goal === 'lose' ? 15 : 12;
  if (reps && Number(reps) >= topOfRange) {
    const exercise = EXERCISES.find(ex => ex.name === exerciseName);
    if (exercise && exercise.equip.includes('dumbbells')) {
      return `When you can do ${topOfRange} reps easily, add ${userUnits(u) === 'imperial' ? '5 lb' : '2.5 kg'} (or a harder variation).`;
    }
  }
  return '';
}

function planTemplates(days) {
  const full = { focus: 'Full body', slots: ['squat', 'pushH', 'pullH', 'hinge', 'pushV', 'core'], max: 6 };
  const upper = { focus: 'Upper body', slots: ['pushH', 'pullH', 'pushV', 'pullV', 'lateral', 'biceps', 'triceps', 'core'], max: 7 };
  const lower = { focus: 'Lower body', slots: ['squat', 'hinge', 'lunge', 'glutes', 'calves', 'core'], max: 6 };
  const push = { focus: 'Chest, shoulders & triceps', slots: ['pushH', 'pushV', 'lateral', 'triceps', 'core'], max: 5 };
  const pull = { focus: 'Back, rear shoulders & biceps', slots: ['pullH', 'pullV', 'rear', 'biceps', 'core'], max: 5 };
  const legs = { focus: 'Legs & glutes', slots: ['squat', 'hinge', 'lunge', 'glutes', 'calves', 'core'], max: 6 };

  if (days === 1) return [{ ...full, label: 'Full Body' }];
  if (days === 2) return [
    { ...upper, label: 'Upper Body' },
    { ...lower, label: 'Lower Body' }
  ];
  if (days === 3) return [
    { ...push, label: 'Push' },
    { ...pull, label: 'Pull' },
    { ...legs, label: 'Legs' }
  ];
  if (days === 4) return [
    { ...upper, label: 'Upper A' },
    { ...lower, label: 'Lower A' },
    { ...upper, label: 'Upper B' },
    { ...lower, label: 'Lower B' }
  ];
  if (days === 5) return [
    { ...push, label: 'Push' },
    { ...pull, label: 'Pull' },
    { ...legs, label: 'Legs' },
    { ...upper, label: 'Upper' },
    { ...lower, label: 'Lower' }
  ];
  if (days === 6) return [
    { ...push, label: 'Push A' },
    { ...pull, label: 'Pull A' },
    { ...legs, label: 'Legs A' },
    { ...push, label: 'Push B' },
    { ...pull, label: 'Pull B' },
    { ...legs, label: 'Legs B' }
  ];
  return [
    { ...push, label: 'Push A' },
    { ...pull, label: 'Pull A' },
    { ...legs, label: 'Legs A' },
    { ...upper, label: 'Upper' },
    { ...lower, label: 'Lower' },
    { ...full, label: 'Full Body' },
    { recovery: true, label: 'Active Recovery', focus: 'Mobility, walking & breathing', slots: [], max: 0 }
  ];
}

function chooseExercises(template, user, variant, adjustments, mode) {
  const p = user.profile;
  const sets = clamp((p.experience === 'beginner' ? 3 : 4) + adjustments.sets, 2, 5);
  const reps = repRangeFor(p.goal);
  const rest = p.goal === 'lose' ? 45 : p.goal === 'maintain' ? 60 : 90;
  const picks = [];

  template.slots.forEach(slot => {
    const options = EXERCISES
      .filter(ex => ex.slots.includes(slot))
      .filter(ex => hasEquipment(ex, p, mode))
      .filter(ex => !injuryAvoids(ex, p.injuries))
      .sort((a, b) => equipmentScore(b, mode) - equipmentScore(a, mode));

    if (!options.length) return;
    let exercise = options[variant % options.length];
    if (picks.some(pick => pick.name === exercise.name)) {
      exercise = options[(variant + 1) % options.length];
    }
    if (picks.some(pick => pick.name === exercise.name)) return;
    picks.push({
      name: exercise.name,
      sets,
      rest,
      cues: exercise.cues,
      reps: HOLD_EXERCISES.has(exercise.name) ? '30–45 sec' : reps
    });
  });

  return picks.slice(0, template.max);
}

function recoveryExercises() {
  return [
    { name: 'Easy walk', sets: 1, reps: '15–20 min', rest: 0, cues: 'Keep a conversational pace. The goal is blood flow, not a calorie burn.' },
    { name: 'Cat-cow', sets: 2, reps: '8–10 slow reps', rest: 20, cues: 'Move your spine gently through flexion and extension without forcing the range.' },
    { name: 'Hip flexor stretch', sets: 2, reps: '30 sec each side', rest: 15, cues: 'Tuck your pelvis slightly and keep your ribs down; you should feel the front of the hip, not the lower back.' },
    { name: 'Thoracic rotation', sets: 2, reps: '8 each side', rest: 15, cues: 'Sit or kneel tall, rotate through the upper back and follow your hand with your eyes.' },
    { name: 'Box breathing', sets: 1, reps: '2–3 min', rest: 0, cues: 'Inhale for four, hold for four, exhale for four, hold for four. Keep the shoulders relaxed.' }
  ];
}

/**
 * Build the weekly workout plan for a user.
 * Determines the day schedule, exercise selection, and automatic adjustments
 * based on the user's profile, goals, available equipment, training history,
 * and course-correction insights (missed workouts, calorie drift, sleep, weight trend).
 *
 * @param {object} user - User state object with profile and logs
 * @returns {object} Plan result: { days, trainingDays, schedule, adjustments, mode, injuries }
 *
 * Plan logic:
 *   1. Get course-correction insights (missed workouts, calorie drift, protein, sleep)
 *   2. Requested training days → adjusted days (may be reduced if many missed)
 *   3. Select template based on available days (1–7)
 *   4. Assign exercises to each day respecting:
 *      - Goal (lose/maintain/build → rep ranges)
 *      - Experience (beginner: 3 sets, intermediate: 4 sets)
 *      - Equipment owned (bodyweight + user-specified)
 *      - Injury-aware filtering (avoid movements linked to noted injuries)
 *   5. Prescribe set/reps/rest and form cues from the exercise database
 *   6. Assign daily finishers (walk, cool-down, or optional walk)
 *
 * Adjustments applied from insights:
 *   - days: −1 or −2 if too many missed workouts this week
 *   - sets: −1 if sleep < 6.5h average
 *   - calorie: ±100 if weekly average calories drift from target
 *   - protein: +10g if average protein < 70% of target
 */
function buildPlan(user) {
  const p = user.profile;
  const mode = planMode();
  const insights = getInsights(user);
  const requested = clamp(Number(p.daysPerWeek) || 3, 1, 7);
  const days = clamp(requested + insights.adjustments.days, 1, 7);
  const templates = planTemplates(days);
  const assignment = WEEK_ASSIGN[days] || WEEK_ASSIGN[3];
  const schedule = WEEKDAY_NAMES.map((name, index) => ({
    weekday: index, weekdayName: name, rest: true, recovery: false,
    label: 'Rest & recover', focus: '', exercises: [], finisher: ''
  }));

  assignment.forEach((weekday, index) => {
    const template = templates[index];
    if (template.recovery) {
      schedule[weekday] = {
        weekday,
        weekdayName: WEEKDAY_NAMES[weekday],
        rest: false,
        recovery: true,
        label: template.label,
        focus: template.focus,
        exercises: recoveryExercises(),
        finisher: 'A short easy walk later in the day is optional.'
      };
      return;
    }
    schedule[weekday] = {
      weekday,
      weekdayName: WEEKDAY_NAMES[weekday],
      rest: false,
      recovery: false,
      label: template.label,
      focus: template.focus,
      exercises: chooseExercises(template, user, index, insights.adjustments, mode),
      finisher: p.goal === 'lose'
        ? '10 min brisk walk or easy bike'
        : p.goal === 'maintain'
          ? '5 min easy cool-down walk'
          : '5 min easy walk to finish'
    };
  });

  const trainingDays = templates.filter(template => !template.recovery).length;
  const plan = { days, trainingDays, schedule, adjustments: insights.adjustments, mode, injuries: p.injuries || '' };
  return applyPlanSwaps(user, plan);
}

function macroBar(label, value, target, unit) {
  const pct = target > 0 ? clamp((value / target) * 100, 0, 100) : 0;
  const over = target > 0 && value > target * 1.1;
  return `
    <div class="macro-bar">
      <div class="macro-head"><span>${label}</span><span>${Math.round(value)} / ${Math.round(target)} ${unit}</span></div>
      <div class="progress ${over ? 'warn' : 'good'}"><span style="width:${pct}%"></span></div>
    </div>`;
}
function foodOptionsMarkup(user, query) {
  const filtered = filterFoodItems(query, FOOD_DB, user.customFoods || []);
  const builtIn = filtered.builtIn.map(food => `<option value="db:${esc(food.name)}">${esc(food.name)} - ${food.cal} kcal / 100 g</option>`).join('');
  const custom = filtered.custom.map(food => `<option value="custom:${esc(food.id)}" data-custom="true" data-serving-grams="${esc(food.servingGrams)}" data-serving-label="${esc(food.servingLabel)}">${esc(food.name)} - ${food.calories} kcal / ${esc(food.servingLabel)}</option>`).join('');
  if (!builtIn && !custom) return '<option value="" disabled selected>No matches - add it as a custom food</option>';
  return `${builtIn ? `<optgroup label="Food database">${builtIn}</optgroup>` : ''}${custom ? `<optgroup label="My foods">${custom}</optgroup>` : ''}`;
}
function syncFoodPortionForm(form, resetAmount) {
  const foodSelect = form.querySelector('[name="food"]');
  const unitSelect = form.querySelector('[name="unit"]');
  const amountInput = form.querySelector('[name="amount"]');
  const hint = form.querySelector('#food-portion-hint');
  const option = foodSelect.selectedOptions[0];
  if (!option || !unitSelect || !amountInput) return;
  const custom = option.dataset.custom === 'true';
  const servingGrams = Number(option.dataset.servingGrams);
  const servingLabel = option.dataset.servingLabel || 'serving';
  const previous = unitSelect.value;
  unitSelect.innerHTML = '<option value="grams">grams</option><option value="100g">100 g portions</option><option value="oz">ounces</option>'
    + (custom ? `<option value="serving">${esc(servingLabel)}</option>` : '');
  unitSelect.value = custom ? 'serving' : (['grams', '100g', 'oz'].includes(previous) ? previous : 'grams');
  const gramsPerUnit = unitSelect.value === 'serving' ? servingGrams : unitSelect.value === '100g' ? 100 : unitSelect.value === 'oz' ? 28.349523125 : 1;
  amountInput.max = String(Math.floor((2000 / gramsPerUnit) * 100) / 100);
  if (resetAmount) amountInput.value = unitSelect.value === 'grams' ? '100' : '1';
  if (hint) {
    hint.textContent = unitSelect.value === 'serving' ? `${servingLabel} = ${servingGrams} g. Nutrition uses your saved serving.`
      : unitSelect.value === '100g' ? 'Each portion is 100 g.'
      : unitSelect.value === 'oz' ? '1 ounce = 28.35 g.' : 'Weight in grams.';
  }
}

// <logic:start>
function recipeMatchScore(recipe, rawIngredients) {
  const tokens = String(rawIngredients || '').toLowerCase().split(/[,;\n]+/).map(item => item.trim()).filter(Boolean);
  if (!tokens.length || !recipe || !Array.isArray(recipe.ingredients)) return null;
  const matched = recipe.ingredients.filter(item => {
    const name = String(item.name || '').toLowerCase();
    return tokens.some(token => name.includes(token) || token.includes(name));
  });
  const matchedSet = new Set(matched);
  const missing = recipe.ingredients.filter(item => !matchedSet.has(item));
  return { matched, missing, ratio: recipe.ingredients.length ? matched.length / recipe.ingredients.length : 0 };
}
// <logic:end>

  const u = state.user;

  const filters = state.chefFilters;
  const filtered = safeRecipes.filter(recipe => {
    const cuisineOk = filters.cuisine === 'All' || recipe.cuisine === filters.cuisine;
    const dietOk = filters.diet === 'All' || (recipe.diets || []).includes(filters.diet);
    const mealOk = filters.meal === 'All' || recipe.meal === filters.meal;
    return cuisineOk && dietOk && mealOk;
  });
  const mealCalories = t.calories / 3;
  const suggestions = [...filtered].sort((a, b) => {
    const aScore = Math.abs(a.cal - mealCalories) - a.p * 2;

    return aScore - bScore;
  });
  const filterBits = [];

/* ---------- Health check / Doctor ---------- */
function renderDoctor() {
  const u = state.user;
  const p = u.profile;
  const t = targets(u);
  const bmi = bmiFor(u);
  const category = bmiCategory(bmi);
  const weight = currentWeight(u);
  const targetCups = hydrationTarget(u);
  const cups = Number(u.logs.hydration[today()] || 0);
  const sleepAvg = sleepAverage(u);
  const warnings = targetWarnings(u);
  const recentSleep = [...u.logs.sleep].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
  const recentSymptoms = [...u.logs.symptoms].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
  const markerPct = clamp(((bmi - 15) / 25) * 100, 1, 99);
  const guidance = [];

  if (bmi < 18.5) guidance.push('Your BMI is below the healthy range. Prioritise nutrient-dense meals and a gradual surplus; if the weight loss was unintentional, see a clinician.');
  else if (bmi < 25) guidance.push('Your BMI sits in the healthy range. The scale is only one signal — strength, energy, sleep and waist measurements matter too.');
  else if (bmi < 30) guidance.push('Your BMI is above the healthy range. A gradual deficit of 300–500 kcal, plus 7,000–9,000 steps a day, is usually more sustainable than a crash diet.');
  else guidance.push('Your BMI is in the obesity range. Low-impact cardio, strength training and a modest deficit are a good start; consider a medical check-up before intense exercise.');

  if (p.injuries) guidance.push(`You noted: "${p.injuries}". Avoid movements that reproduce sharp pain, reduce range or load, and get a physiotherapist or doctor to assess anything that persists.`);
  if (sleepAvg !== null && sleepAvg < 7) guidance.push('Sleep is below 7 hours on average. Aim for a consistent wake time first, then move bedtime earlier by 15 minutes at a time.');
  if (cups < targetCups * 0.6) guidance.push(`Hydration is low today (${cups} of ~${targetCups} cups). Keep a bottle within reach and drink with every meal.`);
  if (p.goal === 'lose' && t.calories <= t.safeMin) guidance.push('Your calorie target is at or near the safety floor. Do not cut further without professional supervision.');
  if (p.allergies) guidance.push(`Allergy note: "${p.allergies}". Double-check ingredient labels and avoid cross-contamination when eating out.`);
  if (!p.injuries && (p.goal === 'gain' || p.goal === 'build') && t.calories - t.tdee > 500) guidance.push('Your surplus is quite large. A slower gain (about 0.25–0.5% of body weight per week) usually keeps fat gain lower.');

  return `

    </div>

    <div class="grid grid-3">

        <div class="stat-label">Body mass index</div>
        <div class="stat-value" style="margin-top:3px">${round(bmi, 1)} <span class="badge ${category.cls}" style="vertical-align:middle">${category.label}</span></div>

      </div>

      <div class="card">
        <div class="stat-label">Hydration</div>
        <div class="stat-value" style="margin-top:3px">${cups}<small>/${targetCups} cups</small></div>
        <div class="water-cups">
          ${Array.from({ length: Math.min(targetCups, 16) }, (_, i) => `<span class="cup ${i < cups ? 'full' : ''}"></span>`).join('')}
        </div>
        <div class="btn-row">
          <button class="btn btn-xs btn-soft" data-action="hydrate" data-delta="1">+ 1 cup</button>
          <button class="btn btn-xs btn-ghost" data-action="hydrate" data-delta="-1">− 1</button>
        </div>
        <p class="tiny muted" style="margin-top:8px">~${targetCups * 250} ml target today. Clear urine and steady energy are practical signs.</p>
      </div>

      <div class="card">
        <div class="stat-label">Sleep</div>
        <div class="stat-value" style="margin-top:3px">${sleepAvg === null ? '—' : round(sleepAvg, 1)}<small>h avg</small></div>
        <p class="tiny muted" style="margin-top:8px">${sleepAvg === null ? 'Log a few nights to see your average.' : sleepAvg < 6.5 ? 'Below the recovery sweet spot. The trainer has reduced volume automatically.' : sleepAvg < 7 ? 'Close. An extra 30–60 minutes would help recovery.' : 'Nice — you are giving recovery a fair chance.'}</p>
      </div>

    ${warnings.length ? warnings.map(warning => `<div class="warning-banner"><strong>Safety check:</strong> ${esc(warning)}</div>`).join('') : ''}

    <div class="grid grid-2">

          </div>
          <button class="btn btn-primary btn-sm" type="submit" style="margin-top:10px">Log sleep</button>
        </form>
        <hr class="divider">
        ${recentSleep.length ? recentSleep.map(entry => `

          </div>
          <button class="btn btn-primary btn-sm" type="submit" style="margin-top:10px">Save note</button>
        </form>
        <hr class="divider">
        ${recentSymptoms.length ? recentSymptoms.map(note => `
          <div class="note-row">
            <div>${esc(note.note)}</div>
            <div class="note-meta">${prettyDate(note.date)} · severity: ${esc(note.severity)}</div>
            <button class="btn btn-xs btn-ghost" data-action="delete-symptom" data-id="${esc(note.id)}" style="margin-top:4px">Delete</button>
          </div>`).join('') : '<div class="empty">No notes yet. Track niggles so you can spot patterns.</div>'}
        ${recentSymptoms.some(note => note.severity === 'high') ? '<div class="warning-banner" style="margin-top:12px">A high-severity note is saved. Please have a qualified professional assess it before training through pain.</div>' : ''}
