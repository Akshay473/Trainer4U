/* ---------------------------------------------------------------------------
   Charts — lightweight canvas charts, no chart library required.
   --------------------------------------------------------------------------- */
function prepareCanvas(canvas) {
  if (!canvas) return null;
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}
function drawLineChart(canvas, points, options = {}) {
  const prepared = prepareCanvas(canvas);
  if (!prepared || !points.length) return;
  const { ctx, w, h } = prepared;
  const pad = { l: 40, r: 14, t: 16, b: 28 };
  const values = points.map(point => Number(point.value));
  if (options.target) values.push(Number(options.target));
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const extra = (max - min) * 0.15;
  min -= extra; max += extra;
  const xFor = index => points.length === 1
    ? pad.l + (w - pad.l - pad.r) / 2
    : pad.l + (index / (points.length - 1)) * (w - pad.l - pad.r);
  const yFor = value => pad.t + ((max - value) / (max - min)) * (h - pad.t - pad.b);
  const accent = options.color || cssVar('--accent');
  const text = cssVar('--muted');
  const line = cssVar('--line');

  ctx.clearRect(0, 0, w, h);
  ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
  ctx.fillStyle = text;
  ctx.strokeStyle = line;
  ctx.lineWidth = 1;

  // Horizontal grid + y labels.
  for (let i = 0; i <= 3; i++) {
    const value = min + ((max - min) * i) / 3;
    const y = yFor(value);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(w - pad.r, y);
    ctx.stroke();
    ctx.fillStyle = text;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${round(value, 1)}`, pad.l - 7, y);
  }

  // Target line.
  if (options.target) {
    const y = yFor(Number(options.target));
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = cssVar('--good');
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(w - pad.r, y);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = cssVar('--good');
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('goal', pad.l + 4, y - 3);
  }

  // Area fill under the line.
  const gradient = ctx.createLinearGradient(0, pad.t, 0, h - pad.b);
  gradient.addColorStop(0, `${accent}3d`);
  gradient.addColorStop(1, `${accent}00`);
  ctx.beginPath();
  points.forEach((point, index) => {
    const x = xFor(index);
    const y = yFor(Number(point.value));
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.lineTo(xFor(points.length - 1), h - pad.b);
  ctx.lineTo(xFor(0), h - pad.b);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  // Main line.
  ctx.beginPath();
  points.forEach((point, index) => {
    const x = xFor(index);
    const y = yFor(Number(point.value));
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Points.
  points.forEach((point, index) => {
    const x = xFor(index);
    const y = yFor(Number(point.value));
    ctx.beginPath();
    ctx.arc(x, y, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = cssVar('--panel');
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // X labels: all if few points, otherwise first / middle / last.
  ctx.fillStyle = text;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'center';
  const labelIndices = points.length <= 6
    ? points.map((_, i) => i)
    : [0, Math.floor((points.length - 1) / 2), points.length - 1];
  labelIndices.forEach(index => {
    ctx.fillText(points[index].label, xFor(index), h - pad.b + 8);
  });
}
function drawBarChart(canvas, points, options = {}) {
  const prepared = prepareCanvas(canvas);
  if (!prepared) return;
  const { ctx, w, h } = prepared;
  const pad = { l: 32, r: 12, t: 16, b: 28 };
  const maxValue = Math.max(1, ...points.map(point => Number(point.value)));
  const top = Math.ceil(maxValue / 2) * 2;
  const text = cssVar('--muted');
  const line = cssVar('--line');
  const accent = options.color || cssVar('--good');

  ctx.clearRect(0, 0, w, h);
  ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
  ctx.strokeStyle = line;
  ctx.fillStyle = text;

  for (let i = 0; i <= 2; i++) {
    const value = (top * i) / 2;
    const y = pad.t + ((top - value) / top) * (h - pad.t - pad.b);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(w - pad.r, y);
    ctx.stroke();
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${value}`, pad.l - 6, y);
  }

  const slot = (w - pad.l - pad.r) / points.length;
  const barWidth = Math.max(6, Math.min(30, slot * 0.55));
  points.forEach((point, index) => {
    const value = Number(point.value);
    const x = pad.l + slot * index + (slot - barWidth) / 2;
    const barHeight = (value / top) * (h - pad.t - pad.b);
    const y = h - pad.b - barHeight;
    const gradient = ctx.createLinearGradient(0, y, 0, h - pad.b);
    gradient.addColorStop(0, accent);
    gradient.addColorStop(1, `${accent}88`);
    ctx.fillStyle = gradient;
    const radius = Math.min(5, barWidth / 2);
    ctx.beginPath();
    ctx.moveTo(x, h - pad.b);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.lineTo(x + barWidth - radius, y);
    ctx.quadraticCurveTo(x + barWidth, y, x + barWidth, y + radius);
    ctx.lineTo(x + barWidth, h - pad.b);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = text;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(point.label, x + barWidth / 2, h - pad.b + 8);
  });
}
function workoutsPerWeek(user, weeks = 8) {
  const start = parseDate(weekStart());
  const result = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const monday = new Date(start);
    monday.setDate(start.getDate() - i * 7);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    const count = user.logs.workouts.filter(workout =>
      workout.date >= isoDate(monday) && workout.date <= isoDate(sunday)
    ).length;
    result.push({
      label: monday.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
      value: count
    });
  }
  return result;
}
function drawCharts() {
  if (!state.user || state.tab !== 'progress') return;
  const u = state.user;
  const units = userUnits(u);
  const weights = sortedWeights(u);
  drawLineChart(
    $('#weightChart'),
    weights.map(entry => ({ label: prettyDate(entry.date), value: displayWeight(entry.kg, units) })),
    { target: u.profile.targetWeight ? displayWeight(u.profile.targetWeight, units) : null, color: cssVar('--accent') }
  );
  const measures = [...u.logs.measurements]
    .filter(entry => Number(entry[state.measure]) > 0)
    .sort((a, b) => a.date.localeCompare(b.date));
  drawLineChart(
    $('#measureChart'),
    measures.map(entry => ({ label: prettyDate(entry.date), value: displayLength(Number(entry[state.measure]), units) })),
    { color: cssVar('--accent') }
  );
  drawBarChart($('#workoutChart'), workoutsPerWeek(u), { color: cssVar('--good') });
}

let modalReturnFocus = null;
function modalFocusable() {
  const dialog = $('#modal-root [role="dialog"]');
  if (!dialog) return [];
  return $$('button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])', dialog)
    .filter(element => element.getClientRects().length > 0);
}
function openModal(modal) {
  if (!state.modal) modalReturnFocus = document.activeElement;
  state.modal = modal;
  document.body.style.overflow = 'hidden';
  app.setAttribute('inert', '');
  renderModal();
}
function closeModal() {
  state.modal = null;
  const root = $('#modal-root');
  if (root) root.innerHTML = '';
  app.removeAttribute('inert');
  document.body.style.overflow = '';
  if (modalReturnFocus && modalReturnFocus.isConnected) modalReturnFocus.focus();
  modalReturnFocus = null;
}
function renderModal() {
  const root = $('#modal-root');
  if (!root) return;
  if (!state.modal) { root.innerHTML = ''; app.removeAttribute('inert'); return; }
  if (state.modal.type === 'settings') root.innerHTML = settingsModalMarkup();
  else if (state.modal.type === 'workout') root.innerHTML = workoutModalMarkup();
  else if (state.modal.type === 'recipe') root.innerHTML = recipeModalMarkup();
  else if (state.modal.type === 'custom-food') root.innerHTML = customFoodModalMarkup();
  else if (state.modal.type === 'backup-password') root.innerHTML = backupPasswordModalMarkup();
  const focusable = modalFocusable();
  if (focusable.length) focusable[0].focus();
}

// <logic:start>
/* Personal records. The best set ever logged per exercise, ranked by the
   Epley estimated one-rep max so different rep ranges compare fairly.
   Bodyweight sets (weight 0) are skipped: there is no load to rank. */
function estimatedOneRepMax(weight, reps) {
  const w = Number(weight) || 0;
  const r = Number(reps) || 0;
  if (w <= 0 || r <= 0) return 0;
  if (r === 1) return w;
  return w * (1 + r / 30);
}

// One best-set record per exercise across the whole workout history,
// strongest first. Returns [{ name, weight, reps, date, oneRepMax }].
function personalRecords(user) {
  const best = new Map();
  ((user && user.logs.workouts) || []).forEach(workout => {
    (workout.exercises || []).forEach(ex => {
      const orm = estimatedOneRepMax(ex.weight, ex.reps);
      if (orm <= 0) return;
      const prev = best.get(ex.name);
      if (!prev || orm > prev.oneRepMax) {
        best.set(ex.name, { name: ex.name, weight: ex.weight, reps: ex.reps, date: workout.date, oneRepMax: orm });
      }
    });
  });
  return [...best.values()].sort((a, b) => b.oneRepMax - a.oneRepMax);
}

// Exercise names in the given workout that beat the best set logged in any
// OTHER workout. A first-ever set establishes the baseline and is not
// flagged, so a brand new log does not cry record on every lift.
function newRecords(user, workoutId) {
  const workouts = (user && user.logs.workouts) || [];
  const current = workouts.find(workout => workout.id === workoutId);
  if (!current) return [];
  const priorBest = new Map();
  workouts.filter(workout => workout.id !== workoutId).forEach(workout => {
    (workout.exercises || []).forEach(ex => {
      const orm = estimatedOneRepMax(ex.weight, ex.reps);
      if (orm <= 0) return;
      const prev = priorBest.get(ex.name);
      if (!prev || orm > prev) priorBest.set(ex.name, orm);
    });
  });
  return (current.exercises || [])
    .filter(ex => {
      const orm = estimatedOneRepMax(ex.weight, ex.reps);
      return orm > 0 && priorBest.has(ex.name) && orm > priorBest.get(ex.name);
    })
    .map(ex => ex.name);
}
// <logic:end>

function lastExerciseLog(user, name) {
  const workouts = [...user.logs.workouts].sort((a, b) => a.date.localeCompare(b.date));
  for (let i = workouts.length - 1; i >= 0; i--) {
    const exercise = workouts[i].exercises?.find(item => item.name === name);
    if (exercise) return exercise;
  }
  return null;
}

   --------------------------------------------------------------------------- */
function normalizeUser(user) {
  user.logs = Object.assign(blankLogs(), user.logs || {});
  if (!Array.isArray(user.customFoods)) user.customFoods = [];
  ['workouts', 'food', 'weights', 'measurements', 'sleep', 'symptoms'].forEach(key => {
    if (!Array.isArray(user.logs[key])) user.logs[key] = [];
  });
  if (!user.logs.hydration || typeof user.logs.hydration !== 'object') user.logs.hydration = {};
  user.profile = user.profile || {};
  user.profile.diet = normalizeDiet(user.profile.diet);
  user.settings = user.settings || { theme: '' };
  user.settings.trainerMode = user.settings.trainerMode === 'home' ? 'home' : 'gym';
  user.settings.units = user.settings.units === 'imperial' ? 'imperial' : 'metric';
  user.key = user.key || String(user.username || '').toLowerCase();
  return user;
}

async function handleLogin(formData) {
  const username = String(formData.get('username') || '').trim().toLowerCase();
  const password = String(formData.get('password') || '');
  const user = state.db.profiles[username];
  if (!user) {
    state.authError = 'No profile found with that username on this browser.';
    renderAuth();
    return;
  }
  const hash = await hashPassword(password, user.salt);
  if (hash !== user.hash) {
    state.authError = 'That password does not match. Try again.';
    renderAuth();
    return;
  }
  state.user = normalizeUser(user);
  state.authError = '';
  try { localStorage.setItem(SESSION_KEY, user.key || username); } catch (err) { /* ignore */ }
  applyTheme();
  if (!state.user.onboarded) renderOnboarding();
  else renderApp();
  toast(`Welcome back, ${state.user.username}!`);
}

async function handleSignup(formData) {
  const username = String(formData.get('username') || '').trim();
  const key = username.toLowerCase();
  const password = String(formData.get('password') || '');
  const confirm = String(formData.get('confirm') || '');

  if (username.length < 3 || username.length > 24 || !/^[a-zA-Z0-9._-]+$/.test(username)) {
    state.authError = 'Use 3–24 letters, numbers, dots, dashes or underscores.';
    renderAuth();
    return;
  }
  if (password.length < 6) {
    state.authError = 'Use at least 6 characters for your password.';
    renderAuth();
    return;
  }
  if (password !== confirm) {
    state.authError = 'The two passwords do not match.';
    renderAuth();
    return;
  }
  if (state.db.profiles[key]) {
    state.authError = 'That username already exists on this browser. Try logging in.';
    renderAuth();
    return;
  }

  const salt = randomSalt();
  const hash = await hashPassword(password, salt);
  const user = normalizeUser(createUser(username, salt, hash));
  state.db.profiles[key] = user;
  saveDB();
  state.user = user;
  state.authError = '';
  try { localStorage.setItem(SESSION_KEY, key); } catch (err) { /* ignore */ }
  renderOnboarding();
  toast('Profile created. Let’s set up your coaching.');
}

// <logic:start>
function validateOnboarding(fields) {
  const errors = [];
  const isNum = v => v != null && String(v).trim() !== '' && Number.isFinite(Number(v));
  const age = isNum(fields.age) ? Number(fields.age) : NaN;
  const height = isNum(fields.height) ? Number(fields.height) : NaN;
  const weight = isNum(fields.weight) ? Number(fields.weight) : NaN;
  if (!Number.isFinite(age) || age < 12 || age > 100) errors.push(['age', 'Please enter a realistic age (12–100).']);
  if (!Number.isFinite(height) || height < 120 || height > 230) errors.push(['height', 'Please enter a realistic height (120–230 cm, about 4 ft – 7 ft 6 in).']);
  if (!Number.isFinite(weight) || weight < 30 || weight > 300) errors.push(['weight', 'Please enter a realistic weight (30–300 kg, about 66–660 lb).']);
  let targetWeight = null;
  const rawTarget = fields.targetWeight != null ? String(fields.targetWeight).trim() : '';
  if (rawTarget !== '') {
    const tw = Number(rawTarget);
    if (!Number.isFinite(tw) || tw < 30 || tw > 300) {
      errors.push(['targetWeight', 'Target weight must be within 30–300 kg (about 66–660 lb).']);
    } else {
      targetWeight = tw;
      if (Number.isFinite(weight)) {
        if (fields.goal === 'lose' && tw >= weight) errors.push(['targetWeight', 'For a weight-loss goal, your target must be lower than your current weight.']);
        else if ((fields.goal === 'gain' || fields.goal === 'build') && tw <= weight) errors.push(['targetWeight', 'For a gain / build goal, your target must be higher than your current weight.']);
      }
    }
  }
  return { errors, values: { age, height, weight, targetWeight } };
}
// <logic:end>
function clearOnboardingErrors(form) {
  form.querySelectorAll('.field-error').forEach(el => el.remove());
  form.querySelectorAll('[name]').forEach(el => { if (el.setCustomValidity) el.setCustomValidity(''); });
}

function handleOnboarding(form, formData) {
  const wasEditing = state.editingProfile;
  const equipment = $$('input[name="equipment"]:checked', form).map(input => input.value);
  if (!equipment.includes('bodyweight')) equipment.unshift('bodyweight');

  // ---- Onboarding validation (rejects unrealistic values, inline errors) ----
  const rawAge = String(formData.get('age') || '').trim();
  let rawHeight = String(formData.get('height') || '').trim();
  let rawWeight = String(formData.get('weight') || '').trim();
  let rawTarget = String(formData.get('targetWeight') || '').trim();
  const rawGoal = String(formData.get('goal') || '');

  // Imperial inputs are converted to the metric values the app stores.
  if (userUnits(state.user) === 'imperial') {
    const feet = Number(rawHeight);
    const inches = Number(String(formData.get('heightIn') || '').trim() || '0');
    rawHeight = rawHeight !== '' && Number.isFinite(feet) ? String(round(inToCm(feet * 12 + inches), 1)) : '';
    rawWeight = rawWeight !== '' && Number.isFinite(Number(rawWeight)) ? String(round(lbToKg(Number(rawWeight)), 2)) : '';
    rawTarget = rawTarget !== '' && Number.isFinite(Number(rawTarget)) ? String(round(lbToKg(Number(rawTarget)), 2)) : '';
  }

  const formError = (id, message) => {
    const field = form.querySelector(`[name="${id}"]`);
    if (field) {
      const wrapper = field.closest('.field');
      if (wrapper) {
        const errBox = wrapper.querySelector('.field-error');
        if (errBox) {
          errBox.textContent = message;
        } else {
          const span = document.createElement('span');
          span.className = 'field-error';
          span.role = 'alert';
          span.textContent = message;
          wrapper.appendChild(span);
        }
      }
      if (field.setCustomValidity) field.setCustomValidity(message);
    }
  };
  clearOnboardingErrors(form);

  const validation = validateOnboarding({
    age: rawAge,
    height: rawHeight,
    weight: rawWeight,
    targetWeight: rawTarget,
    goal: rawGoal
  });
  const errors = validation.errors;

  if (errors.length) {
    errors.forEach(([name, msg]) => formError(name, msg));
    const firstError = form.querySelector('.field-error');
    const firstField = firstError && firstError.closest('.field') ? firstError.closest('.field').querySelector('[name]') : null;
    if (firstField) firstField.focus();
    return; // do not save — will re-render validation state
  }

  const age = validation.values.age;
  const height = validation.values.height;
  const weight = validation.values.weight;
  const targetWeight = validation.values.targetWeight;
  const profile = {
    name: String(formData.get('name') || '').trim() || state.user.username,
    age: age,
    sex: String(formData.get('sex') || 'other'),
    height: height,
    weight: weight,
    targetWeight,
    activity: String(formData.get('activity') || 'moderate'),
    goal: rawGoal || 'maintain',
    diet: normalizeDiet(formData.get('diet') || 'nonveg'),
    allergies: String(formData.get('allergies') || '').trim(),
    injuries: String(formData.get('injuries') || '').trim(),
    equipment,
    daysPerWeek: clamp(safeNum(formData.get('daysPerWeek'), 3), 1, 7),
    experience: String(formData.get('experience') || 'beginner'),
    // A brand-new profile starts its progress bar at the weight entered.
    // Editing keeps the original starting weight so progress stays meaningful.
    startWeight: wasEditing ? (state.user.profile.startWeight || weight) : weight
  };

  state.user.profile = profile;
  state.user.onboarded = true;
  state.editingProfile = false;

  // Keep a real weight entry so progress charts start immediately.
  const latestWeight = sortedWeights(state.user).slice(-1)[0];
  if (!state.user.logs.weights.length) {
    state.user.logs.weights.push({ date: today(), kg: profile.weight });
  } else if (wasEditing && (!latestWeight || latestWeight.kg !== profile.weight)) {
    // A changed profile weight updates today's weigh-in, so targets update too.
    state.user.logs.weights = state.user.logs.weights.filter(entry => entry.date !== today());
    state.user.logs.weights.push({ date: today(), kg: profile.weight });
  }

  saveUser();
  state.tab = 'dashboard';
  renderApp();
  toast('Your plan is ready. Let’s get to work!');
}

// <logic:start>
// Encrypted-export envelopes: shape checks that run before any decryption.
function isEncryptedExport(data) {
  return !!(data && typeof data === 'object' && !Array.isArray(data) && data.encrypted === true);
}
function validateEncryptedEnvelope(data) {
  if (!isEncryptedExport(data)) throw new Error('Not an encrypted Trainer4U backup.');
  const hex = (value, length, label) => {
    if (typeof value !== 'string' || !new RegExp(`^[0-9a-f]{${length}}$`).test(value)) throw new Error(`This backup file looks damaged (${label}).`);
    return value;
  };
  const kdf = data.kdf;
  if (!kdf || kdf.name !== 'PBKDF2' || kdf.hash !== 'SHA-256') throw new Error('This backup uses an unsupported key derivation setup.');
  if (!Number.isInteger(kdf.iterations) || kdf.iterations < 10000 || kdf.iterations > 2000000) throw new Error('This backup uses an unsupported key derivation setup.');
  hex(kdf.salt, 32, 'salt');
  const cipher = data.cipher;
  if (!cipher || cipher.name !== 'AES-GCM') throw new Error('This backup uses an unsupported cipher.');
  hex(cipher.iv, 24, 'iv');
  if (typeof data.data !== 'string' || data.data.length === 0 || data.data.length % 2 !== 0 || !/^[0-9a-f]+$/.test(data.data) || data.data.length > 20 * 1024 * 1024) {
    throw new Error('This backup file looks damaged (ciphertext).');
  }
  return { salt: kdf.salt, iv: cipher.iv, data: data.data };
}
// <logic:end>

// <logic:start>
function validateImportData(data) {
  const object = (value, label) => {
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${label} must be an object.`);
    return value;
  };
  const text = (value, label, max = 500, fallback = '') => {
    if (value === undefined || value === null) return fallback;
    if (typeof value !== 'string' || value.length > max) throw new Error(`${label} must be text up to ${max} characters.`);
    return value;
  };
  const number = (value, label, min, max, fallback = null, integer = false) => {
    if (value === undefined || value === null || value === '') return fallback;
    if (typeof value !== 'number' || !Number.isFinite(value) || value < min || value > max || (integer && !Number.isInteger(value))) {
      throw new Error(`${label} must be ${integer ? 'an integer' : 'a number'} between ${min} and ${max}.`);
    }
    return value;
  };
  const requiredNumber = (value, label, min, max) => {
    if (value === undefined || value === null || value === '') throw new Error(`${label} is required.`);
    return number(value, label, min, max);
  };
  const choice = (value, label, allowed, fallback) => {
    if (value === undefined || value === null || value === '') return fallback;
    if (typeof value !== 'string' || !allowed.includes(value)) throw new Error(`${label} has an unsupported value.`);
    return value;
  };
  const date = value => {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) throw new Error('Every log entry needs a valid YYYY-MM-DD date.');
    const parsed = new Date(`${value}T00:00:00Z`);
    if (!Number.isFinite(parsed.getTime()) || parsed.toISOString().slice(0, 10) !== value) throw new Error(`Invalid log date: ${value}.`);
    return value;
  };
  const list = (value, label, mapper, max = 10000) => {
    if (value === undefined || value === null) return [];
    if (!Array.isArray(value) || value.length > max) throw new Error(`${label} must be an array with at most ${max} entries.`);
    return value.map((entry, index) => mapper(object(entry, `${label} entry ${index + 1}`), index));
  };
  const id = (value, fallback) => text(value, 'Entry ID', 100, fallback);

  object(data, 'Import');
  const rawProfile = object(data.profile, 'Profile');
  const rawLogs = object(data.logs, 'Logs');
  const rawSettings = data.settings === undefined ? {} : object(data.settings, 'Settings');

  const equipment = rawProfile.equipment === undefined ? ['bodyweight'] : rawProfile.equipment;
  if (!Array.isArray(equipment) || equipment.length < 1 || equipment.length > 20 || equipment.some(item => typeof item !== 'string' || !['bodyweight', 'dumbbells', 'bands', 'barbell', 'kettlebell', 'gym', 'cardio'].includes(item))) {
    throw new Error('Equipment contains an unsupported value.');
  }
  const profile = {
    name: text(rawProfile.name, 'Name', 40),
    age: number(rawProfile.age, 'Age', 12, 100, null, true),
    sex: choice(rawProfile.sex, 'Sex', ['male', 'female', 'other'], ''),
    height: number(rawProfile.height, 'Height', 120, 230),
    weight: number(rawProfile.weight, 'Weight', 30, 300),
    targetWeight: number(rawProfile.targetWeight, 'Target weight', 30, 300),
    startWeight: number(rawProfile.startWeight, 'Starting weight', 30, 300),
    activity: choice(rawProfile.activity, 'Activity', ['sedentary', 'light', 'moderate', 'active', 'veryactive'], ''),
    goal: choice(rawProfile.goal, 'Goal', ['lose', 'gain', 'build', 'maintain'], ''),
    diet: choice(rawProfile.diet, 'Diet', ['nonveg', 'vegetarian', 'vegan', 'eggetarian'], 'nonveg'),
    allergies: text(rawProfile.allergies, 'Allergies', 1000),
    injuries: text(rawProfile.injuries, 'Injuries', 2000),
    equipment: [...new Set(equipment)],
    daysPerWeek: number(rawProfile.daysPerWeek, 'Days per week', 1, 7, null, true),
    experience: choice(rawProfile.experience, 'Experience', ['beginner', 'intermediate'], 'beginner')
  };

  const food = list(rawLogs.food, 'Food', (entry, index) => ({
    id: id(entry.id, `import-food-${index}`),
    date: date(entry.date),
    meal: choice(entry.meal, 'Meal', ['Breakfast', 'Lunch', 'Dinner', 'Snack'], 'Snack'),
    name: text(entry.name, 'Food name', 120),
    grams: number(entry.grams, 'Food grams', 0, 2000, 0),
    portion: text(entry.portion, 'Food portion', 80),
    calories: number(entry.calories, 'Food calories', 0, 10000, 0),
    protein: number(entry.protein, 'Food protein', 0, 1000, 0),
    carbs: number(entry.carbs, 'Food carbs', 0, 1000, 0),
    fat: number(entry.fat, 'Food fat', 0, 1000, 0)
  }));
  const rawCustomFoods = data.customFoods === undefined ? [] : data.customFoods;
  const customFoods = list(rawCustomFoods, 'Custom food', (entry, index) => {
    const values = {
      name: text(entry.name, 'Custom food name', 120).trim(),
      servingLabel: text(entry.servingLabel, 'Custom serving name', 40).trim(),
      servingGrams: requiredNumber(entry.servingGrams, 'Custom serving grams', 1, 2000),
      calories: requiredNumber(entry.calories, 'Custom food calories', 0, 5000),
      protein: requiredNumber(entry.protein, 'Custom food protein', 0, 1000),
      carbs: requiredNumber(entry.carbs, 'Custom food carbs', 0, 1000),
      fat: requiredNumber(entry.fat, 'Custom food fat', 0, 1000)
    };
    const validation = validateCustomFood(values);
    if (validation.errors.length) throw new Error(validation.errors[0][1]);
    return { id: id(entry.id, `import-custom-food-${index}`), ...validation.values };
  }, 500);
  if (new Set(customFoods.map(food => food.id)).size !== customFoods.length) throw new Error('Custom food IDs must be unique.');
  const weights = list(rawLogs.weights, 'Weight', entry => ({
    date: date(entry.date), kg: number(entry.kg, 'Weight', 30, 300)
  }));
  const workouts = list(rawLogs.workouts, 'Workout', (entry, index) => ({
    id: id(entry.id, `import-workout-${index}`),
    date: date(entry.date),
    label: text(entry.label, 'Workout label', 120),
    focus: text(entry.focus, 'Workout focus', 200),
    duration: number(entry.duration, 'Workout duration', 0, 240, 0),
    notes: text(entry.notes, 'Workout notes', 2000),
    exercises: list(entry.exercises, 'Workout exercises', exercise => ({
      name: text(exercise.name, 'Exercise name', 120),
      sets: number(exercise.sets, 'Exercise sets', 0, 30, 0),
      reps: number(exercise.reps, 'Exercise reps', 0, 1000, 0),
      weight: number(exercise.weight, 'Exercise weight', 0, 1000, 0)
    }), 100)
  }));
  const measurements = list(rawLogs.measurements, 'Measurement', (entry, index) => ({
    id: id(entry.id, `import-measure-${index}`),
    date: date(entry.date),
    chest: number(entry.chest, 'Chest', 0, 250),
    waist: number(entry.waist, 'Waist', 0, 250),
    hips: number(entry.hips, 'Hips', 0, 250),
    arm: number(entry.arm, 'Arm', 0, 100),
    thigh: number(entry.thigh, 'Thigh', 0, 150)
  }));
  const sleep = list(rawLogs.sleep, 'Sleep', (entry, index) => ({
    id: id(entry.id, `import-sleep-${index}`),
    date: date(entry.date),
    hours: number(entry.hours, 'Sleep hours', 0, 16, 0),
    quality: number(entry.quality, 'Sleep quality', 1, 5, 3)
  }));
  const symptoms = list(rawLogs.symptoms, 'Symptom', (entry, index) => ({
    id: id(entry.id, `import-symptom-${index}`),
    date: date(entry.date),
    note: text(entry.note, 'Symptom note', 2000),
    severity: choice(entry.severity, 'Severity', ['low', 'moderate', 'high'], 'low')
  }));
  const rawHydration = rawLogs.hydration === undefined ? {} : object(rawLogs.hydration, 'Hydration');
  if (Object.keys(rawHydration).length > 10000) throw new Error('Hydration has too many entries.');
  const hydration = {};
  Object.entries(rawHydration).forEach(([day, cups]) => {
    hydration[date(day)] = number(cups, 'Hydration cups', 0, 50, 0);
  });
  const settings = {
    theme: choice(rawSettings.theme, 'Theme', ['', 'light', 'dark'], ''),
    trainerMode: choice(rawSettings.trainerMode, 'Trainer mode', ['gym', 'home'], 'gym'),
    units: choice(rawSettings.units, 'Units', ['metric', 'imperial'], 'metric')
  };
  return { profile, logs: { workouts, food, weights, measurements, sleep, symptoms, hydration }, customFoods, settings };
}
// <logic:end>

async function importData(file) {
  try {
    if (!file || file.size > 5 * 1024 * 1024) throw new Error('Choose a Trainer4U export smaller than 5 MB.');
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (isEncryptedExport(parsed)) {
      validateEncryptedEnvelope(parsed);
      state.pendingEncryptedImport = parsed;
      openModal({ type: 'backup-password', mode: 'import' });
      return;
    }
    await finishImport(parsed);
  } catch (err) {
    toast(`Import failed: ${err.message}`);
  }
}

async function finishImport(parsed) {
  const cleaned = validateImportData(parsed);
  if (!confirm('Replace your current logs with the imported data? Your account and username stay the same.')) return;
  state.user.profile = { ...state.user.profile, ...cleaned.profile };
  state.user.logs = cleaned.logs;
  state.user.customFoods = cleaned.customFoods;
  state.user.settings = { ...state.user.settings, ...cleaned.settings };
  state.user.onboarded = true;
  saveUser();
  closeModal();
  applyTheme();
  renderApp();
  toast('Progress imported successfully.');
}

function resetProgress() {
  if (!confirm('Clear all workout, food, weight, sleep and wellness logs for this profile? Your account and profile stay.')) return;
  const current = currentWeight(state.user);
  state.user.logs = blankLogs();
  state.user.logs.weights.push({ date: today(), kg: current });
  state.user.profile.startWeight = current;
  saveUser();
  closeModal();
  renderApp();
  toast('Progress reset. Fresh start.');
}

function deleteEverything() {
  if (!confirm('Delete ALL profiles and fitness data stored in this browser? This cannot be undone.')) return;
  if (!confirm('Really delete everything? Consider exporting a backup first.')) return;
  try {
    localStorage.removeItem(DB_KEY);
    localStorage.removeItem(SESSION_KEY);
  } catch (err) { /* ignore */ }
  state.db = { profiles: {} };
  state.user = null;
  location.reload();
}

function logout() {
  closeModal();
  try { localStorage.removeItem(SESSION_KEY); } catch (err) { /* ignore */ }
  state.user = null;
  state.tab = 'dashboard';
  state.authMode = 'login';
  state.authError = '';
  renderAuth();
  toast('Logged out.');
}

document.addEventListener('click', event => {
  playClickSound();
  const trigger = event.target.closest('[data-action]');
  if (!trigger) return;
  const action = trigger.dataset.action;
  const u = state.user;

  switch (action) {
    case 'tab':
      state.tab = trigger.dataset.tab;
      state.editingProfile = false;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    case 'toggle-theme':
      toggleTheme();
      break;

    case 'auth-mode':
      state.authMode = trigger.dataset.mode;
      state.authError = '';
      renderAuth();
      break;

    case 'fill-demo': {
      const form = document.querySelector('form[data-form="login"]');
      if (form) {
        const username = form.querySelector('input[name="username"]');
        const password = form.querySelector('input[name="password"]');
        if (username) username.value = 'demo';
        if (password) password.value = 'demo1234';
        toast('Demo credentials filled — press Log in.');
      }
      break;
    }

    case 'open-settings':
      openModal({ type: 'settings' });
      break;

    case 'toggle-units': {
      if (!u) break;
      u.settings = u.settings || {};
      u.settings.units = userUnits(u) === 'imperial' ? 'metric' : 'imperial';
      saveUser();
      renderModal();
      renderApp();
      toast(u.settings.units === 'imperial' ? 'Units set to pounds, feet and inches.' : 'Units set to kilograms and centimetres.');
      break;
    }

    case 'open-custom-food':
      if (u) openModal({ type: 'custom-food' });
      break;

    case 'edit-custom-food': {
      if (!u) break;
      const food = (u.customFoods || []).find(item => item.id === trigger.dataset.id);
      if (food) openModal({ type: 'custom-food', editId: food.id });
      break;
    }

    case 'log-recipe': {
      if (!u) break;
      const recipe = RECIPES[state.modal && state.modal.index];
      if (!recipe) break;
      const mealSelect = document.getElementById('recipe-log-meal');
      const meal = ['Breakfast', 'Lunch', 'Dinner', 'Snack'].includes(mealSelect && mealSelect.value) ? mealSelect.value : 'Snack';
      u.logs.food.push({
        id: uid(), date: today(), meal, name: recipe.name, grams: null,
        calories: recipe.cal, protein: recipe.p, carbs: recipe.c, fat: recipe.f, portion: '1 serving'
      });
      saveUser();
      closeModal();
      renderApp();
      toast(`${recipe.name} logged to ${meal.toLowerCase()}.`);
      break;
    }

    case 'close-modal':
      // Ignore clicks inside the sheet itself.
      if (trigger.classList.contains('modal-overlay') && event.target !== trigger) break;
      closeModal();
      break;

    case 'edit-profile':
      state.editingProfile = true;
      closeModal();
      renderApp();
      break;

    case 'cancel-edit':
      state.editingProfile = false;
      renderApp();
      break;

    case 'logout':
      logout();
      break;

    case 'swap-exercise': {
      if (!u) break;
      const swapDay = Number(trigger.dataset.day);
      const shownName = trigger.dataset.name;
      const swapPlan = buildPlan(u);
      const dayCard = swapPlan.schedule[swapDay];
      if (!dayCard || dayCard.rest || dayCard.recovery || !shownName) break;
      const swapMode = swapPlan.mode;
      if (!u.planSwaps) u.planSwaps = {};
      if (!u.planSwaps[swapMode]) u.planSwaps[swapMode] = {};
      const dayMap = { ...(u.planSwaps[swapMode][swapDay] || {}) };
      // The shown exercise may itself be a swap; find the planner's original pick.
      let originalName = shownName;
      Object.keys(dayMap).forEach(orig => { if (dayMap[orig] === shownName) originalName = orig; });
      const otherNames = dayCard.exercises.map(ex => ex.name).filter(name => name !== shownName);
      const cycle = [originalName, ...swapCandidates(u, swapMode, otherNames, originalName)];
      if (cycle.length === 1) {
        toast('No alternative for this movement with your equipment and injury notes.');
        break;
      }
      const nextName = cycle[(cycle.indexOf(shownName) + 1) % cycle.length];
      Object.keys(dayMap).forEach(key => { if (key === originalName || dayMap[key] === shownName) delete dayMap[key]; });
      if (nextName !== originalName) dayMap[originalName] = nextName;
      if (Object.keys(dayMap).length) u.planSwaps[swapMode][swapDay] = dayMap;
      else delete u.planSwaps[swapMode][swapDay];
      saveUser();
      renderApp();
      toast(nextName === originalName ? `${originalName} is back in the plan.` : `Swapped ${shownName} for ${nextName}. Tap Swap again for another option.`);
      break;
    }

    case 'log-workout':
      openModal({ type: 'workout', dayIndex: Number(trigger.dataset.day) });
      break;

    case 'delete-workout':
      if (!u) break;
      u.logs.workouts = u.logs.workouts.filter(workout => workout.id !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Workout deleted.');
      break;

    case 'delete-food':
      if (!u) break;
      u.logs.food = u.logs.food.filter(entry => entry.id !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Food entry removed.');
      break;

    case 'delete-custom-food': {
      if (!u) break;
      const food = (u.customFoods || []).find(item => item.id === trigger.dataset.id);
      if (!food) break;
      if (!confirm(`Remove ${food.name} from My foods? Existing diary entries will stay.`)) break;
      u.customFoods = u.customFoods.filter(item => item.id !== food.id);
      saveUser();
      renderApp();
      toast('Custom food removed. Diary entries were kept.');
      break;
    }

    case 'delete-weight':
      if (!u) break;
      u.logs.weights = u.logs.weights.filter(entry => entry.date !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Weigh-in removed.');
      break;

    case 'delete-sleep':
      if (!u) break;
      u.logs.sleep = u.logs.sleep.filter(entry => entry.id !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Sleep entry removed.');
      break;

    case 'delete-symptom':
      if (!u) break;
      u.logs.symptoms = u.logs.symptoms.filter(entry => entry.id !== trigger.dataset.id);
      saveUser();
      renderApp();
      toast('Note removed.');
      break;

    case 'hydrate': {
      if (!u) break;
      const delta = Number(trigger.dataset.delta) || 0;
      const date = today();
      const next = Math.max(0, (Number(u.logs.hydration[date]) || 0) + delta);
      u.logs.hydration[date] = next;
      saveUser();
      renderApp();
      toast(`${next} cup${next === 1 ? '' : 's'} logged today.`);
      break;
    }

    case 'trainer-mode': {
      state.trainerMode = trigger.dataset.mode === 'home' ? 'home' : 'gym';
      if (u) {
        u.settings = u.settings || {};
        u.settings.trainerMode = state.trainerMode;
        saveUser();
      }
      renderApp();
      break;
    }

    case 'recipe-open':
      openModal({ type: 'recipe', index: Number(trigger.dataset.index), step: 0 });
      break;

    case 'clear-chef-filters':
      state.chefFilters = { cuisine: 'All', diet: 'All', meal: 'All' };
      renderApp();
      break;

    case 'recipe-nav': {
      if (!state.modal || state.modal.type !== 'recipe') break;
      const recipe = RECIPES[state.modal.index];
      state.modal.step = clamp((state.modal.step || 0) + Number(trigger.dataset.dir), 0, recipe.steps.length - 1);
      renderModal();
      const modal = $('.modal');
      if (modal) modal.scrollTop = 0;
      break;
    }

    case 'clear-ingredients':
      state.chefIngredients = '';
      renderApp();
      break;

    case 'export-data':
      exportData();
      break;

    case 'export-encrypted':
      if (u) openModal({ type: 'backup-password', mode: 'export' });
      break;

    case 'reset-progress':
      resetProgress();
      break;

    case 'delete-all':
      deleteEverything();
      break;

    case 'goto-tab':
      state.tab = trigger.dataset.tab;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      break;

    default:
      break;
  }
});

document.addEventListener('submit', async event => {
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();
  const type = form.dataset.form;
  const formData = new FormData(form);
  const u = state.user;

  try {
    if (type === 'login') {
      await handleLogin(formData);
      return;
    }
    if (type === 'signup') {
      await handleSignup(formData);
      return;
    }
    if (type === 'onboarding') {
      handleOnboarding(form, formData);
      return;
    }
    if (!u) return;

    if (type === 'backup-password') {
      const mode = state.modal && state.modal.mode;
      const password = String(formData.get('password') || '');
      if (mode === 'export') {
        const confirmPassword = String(formData.get('confirm') || '');
        if (password.length < 8) { state.modal.error = 'Choose at least 8 characters.'; renderModal(); return; }
        if (password !== confirmPassword) { state.modal.error = 'The two passwords do not match.'; renderModal(); return; }
        try {
          const envelope = await encryptBackupText(JSON.stringify(exportPayload(), null, 2), password);
          download(`trainer4u-${u.username}-${today()}.encrypted.json`, JSON.stringify(envelope, null, 2));
          closeModal();
          toast('Encrypted backup downloaded.');
        } catch (err) {
          state.modal.error = err.message;
          renderModal();
        }
        return;
      }
      const envelope = state.pendingEncryptedImport;
      if (!envelope) { closeModal(); return; }
      try {
        const text = await decryptBackupEnvelope(envelope, password);
        state.pendingEncryptedImport = null;
        await finishImport(JSON.parse(text));
      } catch (err) {
        state.modal = { type: 'backup-password', mode: 'import', error: 'That backup password did not work, or the file is damaged.' };
        renderModal();
      }
      return;
    }

    if (type === 'custom-food') {
      const validation = validateCustomFood({
        name: formData.get('name'),
        servingLabel: formData.get('servingLabel'),
        servingGrams: formData.get('servingGrams'),
        calories: formData.get('calories'),
        protein: formData.get('protein'),
        carbs: formData.get('carbs'),
        fat: formData.get('fat')
      });
      if (validation.errors.length) { toast(validation.errors[0][1]); return; }
      u.customFoods = u.customFoods || [];
      const editId = state.modal && state.modal.editId;
      const existing = editId ? u.customFoods.find(item => item.id === editId) : null;
      if (existing) {
        Object.assign(existing, validation.values);
        saveUser();
        closeModal();
        renderApp();
        toast(`${existing.name} updated. Entries already logged keep their original numbers.`);
        return;
      }
      if (u.customFoods.length >= 500) { toast('My foods is full. Remove a custom food before adding another.'); return; }
      u.customFoods.push({ id: uid(), ...validation.values });
      saveUser();
      closeModal();
      renderApp();
      toast(`${validation.values.name} saved to My foods.`);
      return;
    }

    if (type === 'add-food') {
      const date = String(formData.get('date') || today());
      const key = String(formData.get('food') || '');
      const amount = Number(formData.get('amount'));
      const unit = String(formData.get('unit') || 'grams');
      const meal = String(formData.get('meal') || 'Snack');
      if (date > today()) { toast('You cannot log food in the future.'); return; }
      const food = key.startsWith('custom:')
        ? (u.customFoods || []).find(item => item.id === key.slice(7))
        : key.startsWith('db:') ? FOOD_DB.find(item => item.name === key.slice(3)) : null;
      if (!food) { toast('Pick a food from the list.'); return; }
      const grams = gramsForPortion(amount, unit, food);
      if (!Number.isFinite(grams) || grams <= 0 || grams > 2000) { toast('Enter a portion that weighs between 0 and 2,000 grams.'); return; }
      const portion = unit === 'serving' ? `${Number(amount)} × ${food.servingLabel}`
        : unit === '100g' ? `${Number(amount)} × 100 g`
        : unit === 'oz' ? `${Number(amount)} oz` : '';
      u.logs.food.push(foodEntryFromFood(date, meal, food, grams, portion));
      saveUser();
      renderApp();
      toast(`${food.name} added to ${meal.toLowerCase()}.`);
      return;
    }

    if (type === 'add-weight') {
      const date = String(formData.get('date') || today());
      const kg = parseWeightInput(formData.get('kg'), userUnits(u));
      if (date > today()) { toast('You cannot log a future weigh-in.'); return; }
      if (!kg || kg < 30 || kg > 300) { toast(userUnits(u) === 'imperial' ? 'Enter a weight between 66 and 660 lb.' : 'Enter a weight between 30 and 300 kg.'); return; }
      u.logs.weights = u.logs.weights.filter(entry => entry.date !== date);
      u.logs.weights.push({ date, kg: round(kg, 1) });
      if (!u.profile.startWeight) u.profile.startWeight = kg;
      u.profile.weight = round(kg, 1);
      saveUser();
      renderApp();
      toast('Weight saved.');
      return;
    }

    if (type === 'add-measure') {
      const date = String(formData.get('date') || today());
      if (date > today()) { toast('You cannot log future measurements.'); return; }
      const measureUnits = userUnits(u);
      const toCm = value => {
        const raw = String(value ?? '').trim();
        if (raw === '') return null;
        const cm = parseLengthInput(raw, measureUnits);
        return Number.isFinite(cm) && cm > 0 ? round(cm, 1) : null;
      };
      const entry = {
        id: uid(),
        date,
        chest: toCm(formData.get('chest')),
        waist: toCm(formData.get('waist')),
        hips: toCm(formData.get('hips')),
        arm: toCm(formData.get('arm')),
        thigh: toCm(formData.get('thigh'))
      };
      if (!entry.chest && !entry.waist && !entry.hips && !entry.arm && !entry.thigh) {
        toast('Add at least one measurement.');
        return;
      }
      u.logs.measurements = u.logs.measurements.filter(item => item.date !== date);
      u.logs.measurements.push(entry);
      saveUser();
      renderApp();
      toast('Measurements saved.');
      return;
    }

    if (type === 'add-sleep') {
      const date = String(formData.get('date') || today());
      const hours = Number(formData.get('hours'));
      if (date > today()) { toast('You cannot log future sleep.'); return; }
      if (!hours || hours <= 0 || hours > 16) { toast('Enter sleep hours between 0 and 16.'); return; }
      u.logs.sleep.push({
        id: uid(), date, hours: round(hours, 2),
        quality: clamp(Number(formData.get('quality')) || 3, 1, 5)
      });
      saveUser();
      renderApp();
      toast('Sleep logged.');
      return;
    }

    if (type === 'add-symptom') {
      const date = String(formData.get('date') || today());
      const note = String(formData.get('note') || '').trim();
      if (!note) { toast('Describe what you are noticing.'); return; }
      if (date > today()) { toast('You cannot log future notes.'); return; }
      u.logs.symptoms.push({
        id: uid(), date, note,
        severity: String(formData.get('severity') || 'low')
      });
      saveUser();
      renderApp();
      toast('Note saved. Take care of yourself.');
      return;
    }

    if (type === 'chef-ingredients') {
      state.chefIngredients = String(formData.get('ingredients') || '').trim();
      renderApp();
      if (!state.chefIngredients) toast('Add a few ingredients to search.');
      return;
    }

    if (type === 'log-workout') {
      const dayIndex = Number(form.dataset.day);
      const plan = buildPlan(u);
      const day = plan.schedule[dayIndex];
      if (!day || day.rest) { toast('That day is a rest day.'); closeModal(); return; }
      const exercises = day.exercises.map((exercise, index) => {
        const defaultReps = parseInt(String(exercise.reps).split(/[–-]/).pop(), 10) || 12;
        return {
          name: exercise.name,
          sets: exercise.sets,
          reps: Number(formData.get(`r${index}`)) || defaultReps,
          weight: parseWeightInput(formData.get(`w${index}`), userUnits(u)) || 0
        };
      });
      const workoutId = uid();
      u.logs.workouts.push({
        id: workoutId,
        date: String(formData.get('date') || today()),
        label: day.label,
        focus: day.focus,
        duration: clamp(Number(formData.get('duration')) || 45, 5, 240),
        notes: String(formData.get('notes') || '').trim(),
        exercises
      });
      const recordsHit = newRecords(u, workoutId);
      saveUser();
      closeModal();
      renderApp();
      toast(recordsHit.length
        ? `Workout logged — new personal record${recordsHit.length === 1 ? '' : 's'}: ${recordsHit.slice(0, 3).join(', ')}${recordsHit.length > 3 ? ` +${recordsHit.length - 3} more` : ''}!`
        : 'Workout logged. Strong work!');
      return;
    }
  } catch (err) {
    console.error(err);
    toast('Something went wrong. Please try again.');
  }
});

document.addEventListener('input', event => {

document.addEventListener('change', async event => {
  const input = event.target;
  const onboardingForm = input.closest('form[data-form="onboarding"]');
  if (onboardingForm) clearOnboardingErrors(onboardingForm);
  if (input.id === 'food-name' || input.id === 'food-unit') {
    const form = input.closest('form[data-form="add-food"]');
    if (form) syncFoodPortionForm(form, true);
    return;
  }
  if (input.id === 'import-file' && input.files && input.files[0]) {
    await importData(input.files[0]);
    input.value = '';
    return;
  }
  if (input.matches('[data-change="measure"]')) {
    state.measure = input.value;
    renderApp();
    return;
  }
  if (input.matches('[data-change="chef-cuisine"], [data-change="chef-diet"], [data-change="chef-meal"]')) {
    const key = input.dataset.change.replace('chef-', '');
    if (key === 'cuisine' || key === 'diet' || key === 'meal') {
      state.chefFilters[key] = input.value;
      renderApp();
    }
  }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && state.modal) {
    event.preventDefault();
    closeModal();
    return;
  }
  if (event.key === 'Tab' && state.modal) {
    const focusable = modalFocusable();
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.tab === 'progress') drawCharts();
  }, 150);
});

/* ---------------------------------------------------------------------------
   10) BOOT
   --------------------------------------------------------------------------- */
async function init() {
  state.db = loadDB();
  applyTheme();
  await seedDemoProfile();

  let session = null;
  try { session = localStorage.getItem(SESSION_KEY); } catch (err) { /* ignore */ }

  if (session && state.db.profiles[session]) {
    state.user = normalizeUser(state.db.profiles[session]);
    applyTheme();
    if (!state.user.onboarded) renderOnboarding();
    else renderApp();
  } else {
    renderAuth();
  }
}

// The markup lives inside this same file, so the DOM is ready when this runs.
init();

// Register service worker only on http/https (not file://)
if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    // Pages already controlled by an older worker reload once when a new one takes
    // over, so deployed fixes show up without a manual hard refresh. First-ever
    // installs have no controller and must not reload.
    const hadController = Boolean(navigator.serviceWorker.controller);
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js')
      .then(registration => {
        registration.update();
        console.log('SW registered: scope', registration.scope);
      })
      .catch(registrationError => {
        console.log('SW registration failed: ', registrationError);
      });
  });
}
</script>
